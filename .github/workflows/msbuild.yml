name: MSBuild

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

env:
  CHIAKI_ENABLE_STEAMWORKS: "OFF"

jobs:
  build:
    name: Build Pylux Windows x86_64
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup MSYS2 toolchain
        uses: msys2/setup-msys2@v2
        with:
          msystem: mingw64
          update: true
          install: git
          pacboy: >-
            ca-certificates:p
            cc:p
            cmake:p
            curl:p
            diffutils:p
            fast_float:p
            fftw:p
            hidapi:p
            json-c:p
            lcms2:p
            libdovi:p
            meson:p
            miniupnpc:p
            gcc:p
            nasm:p
            ninja:p
            openssl:p
            opus:p
            pkgconf:p
            protobuf:p
            python:p
            python-psutil:p
            python-glad:p
            python-jinja:p
            python-pip:p
            qt6-base:p
            qt6-declarative:p
            qt6-svg:p
            SDL2:p
            shaderc:p
            speexdsp:p
            spirv-cross:p
            vulkan:p
            vulkan-headers:p

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install protobuf
          pacman -S --noconfirm git make unzip zip jq

      - name: Configure CMake project
        run: |
          cmake -S . -B build -G "Ninja" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCHIAKI_ENABLE_CLI=OFF \
            -DCHIAKI_ENABLE_STEAMWORKS=${{ env.CHAKI_ENABLE_STEAMWORKS }} \
            -DCHIAKI_ENABLE_STEAM_SHORTCUT=ON

      - name: Build project
        run: |
          cmake --build build --config Release --clean-first --target chiaki
