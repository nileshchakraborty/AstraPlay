name: MSBuild

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["dev", "master"]

concurrency:
  group: msbuild-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CHIAKI_ENABLE_STEAMWORKS: "OFF"

jobs:
  build:
    name: Build AstraPlay Windows x86_64
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup MSYS2 toolchain
        uses: msys2/setup-msys2@v2
        with:
          msystem: mingw64
          update: true
          install: git diffutils
          pacboy: >-
            ca-certificates:p
            cc:p
            cmake:p
            curl:p
            fast_float:p
            fftw:p
            json-c:p
            lcms2:p
            libdovi:p
            meson:p
            miniupnpc:p
            gcc:p
            nasm:p
            ninja:p
            openssl:p
            opus:p
            pkgconf:p
            protobuf:p
            python:p
            python-psutil:p
            python-glad:p
            python-jinja:p
            python-pip:p
            qt6-base:p
            qt6-declarative:p
            qt6-svg:p
            SDL2:p
            shaderc:p
            speexdsp:p
            spirv-cross:p
            vulkan:p
            vulkan-headers:p

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install protobuf
          pacman -S --noconfirm git make unzip zip jq

      - name: Build libplacebo
        run: |
          scripts/build-libplacebo-windows.sh

      - name: Setup ffmpeg
        run: |
          curl -LO https://github.com/streetpea/FFmpeg-Builds/releases/download/latest/ffmpeg-n7.1-latest-win64-gpl-shared-7.1.zip
          unzip ffmpeg-n7.1-latest-win64-gpl-shared-7.1.zip
          cp -a "ffmpeg-n7.1-latest-win64-gpl-shared-7.1/bin/." /mingw64/bin
          cp -a "ffmpeg-n7.1-latest-win64-gpl-shared-7.1/include/." /mingw64/include
          cp -a "ffmpeg-n7.1-latest-win64-gpl-shared-7.1/lib/." /mingw64/lib

      - name: Add QmlWebEngine Import
        run: |
          cp scripts/qtwebengine_import.qml gui/src/qml/

      - name: Configure CMake project
        run: |
          cmake -S . -B build -G "Ninja" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCHIAKI_ENABLE_CLI=OFF \
            -DCHIAKI_ENABLE_STEAMWORKS=${{ env.CHIAKI_ENABLE_STEAMWORKS }} \
            -DCHIAKI_ENABLE_STEAM_SHORTCUT=ON

      - name: Build project
        run: |
          cmake --build build --config Release --clean-first --target astraplay
          if [ -f build/gui/AstraPlay.exe ] && [ ! -f build/gui/astraplay.exe ]; then
            cp build/gui/AstraPlay.exe build/gui/astraplay.exe
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: astraplay-windows-x64
          path: |
            build/gui/*.exe
