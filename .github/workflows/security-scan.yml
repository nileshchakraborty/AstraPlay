name: Security Scan & Secret Protection

on:
  push:
    branches: [master, dev]
  pull_request:
    branches: [master, dev]

permissions:
  contents: read
  security-events: write

jobs:
  secret-scan:
    name: Secret & Credential Leak Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan for Hardcoded Secrets and Private Keys
        run: |
          echo "Scanning repository for high-entropy secrets and private keys..."
          FAIL=0

          # Check for private key headers
          if grep -rnEI --exclude-dir={.git,build*,third-party} "BEGIN (RSA|EC|DSA|OPENSSH) PRIVATE KEY" .; then
            echo "::error::Found private key in repository!"
            FAIL=1
          fi

          # Check for PSN tokens or OAuth hardcodes
          if grep -rnEI --exclude-dir={.git,build*,third-party,tests,test} -E "npsso[[:space:]]*=[[:space:]]*['\"][a-zA-Z0-9]{30,}['\"]" .; then
            echo "::error::Found potential hardcoded NPSSO token!"
            FAIL=1
          fi

          # Check for Discord bot tokens
          if grep -rnEI --exclude-dir={.git,build*,third-party} -E "(bot_token|DISCORD_TOKEN)[[:space:]]*=[[:space:]]*['\"][a-zA-Z0-9_\-\.]{50,}['\"]" .; then
            echo "::error::Found potential hardcoded Discord token!"
            FAIL=1
          fi

          if [ $FAIL -ne 0 ]; then
            echo "Security check failed: credentials or private keys detected in source code."
            exit 1
          fi
          echo "No secrets or private keys detected."

  codeql-analysis:
    name: CodeQL SAST Analysis
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: ['cpp']
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: security-extended,security-and-quality

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build pkg-config \
            libsdl2-dev libspeexdsp-dev libplacebo-dev libvulkan-dev \
            libavcodec-dev libavformat-dev libavutil-dev libswscale-dev \
            libjson-c-dev libminiupnpc-dev libssl-dev libopus-dev libfftw3-dev \
            libhidapi-dev libudev-dev libevdev-dev \
            qt6-base-dev qt6-declarative-dev qt6-svg-dev qt6-base-private-dev \
            protobuf-compiler libprotobuf-dev python3-protobuf

      - name: Configure and Build
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCHIAKI_ENABLE_TESTS=ON
          cmake --build build -j$(nproc)

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
