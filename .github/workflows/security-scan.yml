name: Security Scan & Secret Protection

on:
  push:
    branches: [master, dev]
  pull_request:
    branches: [master, dev]

permissions:
  contents: read

# CodeQL runs through the repository's configured default setup.
# GitHub rejects SARIF uploads from advanced workflows while default setup is enabled.
jobs:
  secret-scan:
    name: Secret & Credential Leak Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan for Hardcoded Secrets and Private Keys
        run: |
          echo "Scanning repository for high-entropy secrets and private keys..."
          FAIL=0

          # Check for private key headers
          if grep -rnEI --exclude-dir={.git,build*,third-party} "BEGIN (RSA|EC|DSA|OPENSSH) PRIVATE KEY" .; then
            echo "::error::Found private key in repository!"
            FAIL=1
          fi

          # Check for PSN tokens or OAuth hardcodes
          if grep -rnEI --exclude-dir={.git,build*,third-party,tests,test} -E "npsso[[:space:]]*=[[:space:]]*['\"][a-zA-Z0-9]{30,}['\"]" .; then
            echo "::error::Found potential hardcoded NPSSO token!"
            FAIL=1
          fi

          # Check for Discord bot tokens
          if grep -rnEI --exclude-dir={.git,build*,third-party} -E "(bot_token|DISCORD_TOKEN)[[:space:]]*=[[:space:]]*['\"][a-zA-Z0-9_\-\.]{50,}['\"]" .; then
            echo "::error::Found potential hardcoded Discord token!"
            FAIL=1
          fi

          if [ $FAIL -ne 0 ]; then
            echo "Security check failed: credentials or private keys detected in source code."
            exit 1
          fi
          echo "No secrets or private keys detected."
