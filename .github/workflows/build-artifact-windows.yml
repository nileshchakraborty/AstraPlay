# Build Windows artifact — on-demand, build-only.

name: Build Windows (artifact)

on:
  workflow_dispatch:
    inputs:
      arch:
        description: "Target Windows Architecture"
        required: true
        type: choice
        default: "x86_64"
        options:
          - "x86_64"
          - "arm64"
          - "both"

concurrency:
  group: build-artifact-windows-${{ github.ref }}-${{ inputs.arch }}
  cancel-in-progress: true

env:
  CHIAKI_ENABLE_STEAMWORKS: "OFF"

jobs:
  # =========================================================================
  # WINDOWS X86_64
  # =========================================================================
  build-x86_64:
    name: Build Windows x86_64 (artifact)
    if: inputs.arch == 'x86_64' || inputs.arch == 'both' || inputs.arch == ''
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Disable autocrlf
        shell: pwsh
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf

      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: msys2/setup-msys2@v2
        with:
          msystem: mingw64
          update: true
          install: git diffutils
          pacboy: >-
            ca-certificates:p
            cc:p
            cmake:p
            curl:p
            fast_float:p
            fftw:p
            json-c:p
            lcms2:p
            libdovi:p
            meson:p
            miniupnpc:p
            gcc:p
            nasm:p
            ninja:p
            openssl:p
            opus:p
            pkgconf:p
            protobuf:p
            python:p
            python-psutil:p
            python-glad:p
            python-jinja:p
            python-pip:p
            qt6-base:p
            qt6-declarative:p
            qt6-svg:p
            SDL2:p
            shaderc:p
            speexdsp:p
            spirv-cross:p
            vulkan:p
            vulkan-headers:p

      - name: Set short commit hash
        run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Install python protobuf and zip
        run: |
          pip install protobuf
          pacman -S git make unzip zip jq --noconfirm

      - name: Build libplacebo
        run: |
          scripts/build-libplacebo-windows.sh

      - name: Setup ffmpeg
        run: |
          curl -LO https://github.com/streetpea/FFmpeg-Builds/releases/download/latest/ffmpeg-n7.1-latest-win64-gpl-shared-7.1.zip
          unzip ffmpeg-n7.1-latest-win64-gpl-shared-7.1.zip
          cp -a "ffmpeg-n7.1-latest-win64-gpl-shared-7.1/bin/." /mingw64/bin
          cp -a "ffmpeg-n7.1-latest-win64-gpl-shared-7.1/include/." /mingw64/include
          cp -a "ffmpeg-n7.1-latest-win64-gpl-shared-7.1/lib/." /mingw64/lib

      - name: Add QmlWebEngine Import
        run: |
          cp scripts/qtwebengine_import.qml gui/src/qml/

      - name: Configure AstraPlay
        run: |
          cmake -S . -B build -G "Ninja" -DCMAKE_BUILD_TYPE=Release -DCHIAKI_ENABLE_CLI=OFF -DCHIAKI_ENABLE_STEAMDECK_NATIVE=OFF -DCHIAKI_ENABLE_STEAMWORKS=${{ env.CHIAKI_ENABLE_STEAMWORKS }} -DCHIAKI_ENABLE_STEAM_SHORTCUT=ON

      - name: Build AstraPlay
        run: |
          cmake --build build --config Release --clean-first --target astraplay

      - name: Package AstraPlay
        run: |
          mkdir -p astraplay
          [ -f build/gui/astraplay.exe ] && cp -f build/gui/astraplay.exe astraplay/astraplay.exe || cp -f build/gui/*.exe astraplay/astraplay.exe
          export PATH="${{ github.workspace }}/build/third-party/cpp-steam-tools:/mingw64/share/qt6/bin/:/mingw64/bin/:${PATH}"
          export QT_PLUGIN_PATH="/mingw64/share/qt6/plugins"
          export QML2_IMPORT_PATH="/mingw64/share/qt6/qml"
          echo astraplay/astraplay.exe > tmp0.txt
          while [ -e tmp0.txt ]
          do
            cp tmp0.txt tmp.txt
            rm tmp0.txt
            sort -u tmp.txt -o tmp.txt
            ldd $(<tmp.txt) | awk '($2 == "=>") { print $3 }' | while read -r dep; do
              case "$dep" in
                ""|*"/Windows/"*|*"/WINDOWS/"*|*"/System32/"*|*"/SYSTEM32/"*|*"/SysWOW64/"*|*"/SYSWOW64/"*)
                  continue
                  ;;
              esac
              if [ -f "$dep" ] && [ ! -e "astraplay/${dep##*/}" ]; then
                echo "Copied $dep"
                cp "$dep" astraplay/
                echo "$dep" >> tmp0.txt
              fi
            done
          done
          windeployqt6.exe --no-translations --qmldir=gui/src/qml astraplay/astraplay.exe
          find astraplay -type d \( -name plugins -o -name imageformats -o -name platforms -o -name sqldrivers \) -exec find {} -name "*.dll" \; | while read plugin; do
            echo "$plugin" >> tmp0.txt
          done
          while [ -e tmp0.txt ] && [ -s tmp0.txt ]
          do
            cp tmp0.txt tmp.txt
            rm tmp0.txt
            sort -u tmp.txt -o tmp.txt
            ldd $(<tmp.txt) 2>/dev/null | awk '($2 == "=>") { print $3 }' | while read -r dep; do
              case "$dep" in
                ""|*"/Windows/"*|*"/WINDOWS/"*|*"/System32/"*|*"/SYSTEM32/"*|*"/SysWOW64/"*|*"/SYSWOW64/"*)
                  continue
                  ;;
              esac
              if [ -f "$dep" ] && [ ! -e "astraplay/${dep##*/}" ]; then
                cp "$dep" astraplay/
                echo "$dep" >> tmp0.txt
              fi
            done
          done
          rm -f tmp0.txt tmp.txt

      - name: Create portable zip
        run: |
          zip -r astraplay-windows-x64.zip astraplay

      - name: Extract version
        id: extract_version
        uses: ./.github/actions/extract-version

      - name: Build development MSIX
        shell: pwsh
        run: |
          python scripts/build-windows-msix.py astraplay-windows-x64.zip "${{ steps.extract_version.outputs.version }}" x64 astraplay-windows-x64-development.msix

      - name: Upload unsigned development MSIX
        uses: actions/upload-artifact@v7
        with:
          name: AstraPlay-Windows-x64-development-msix
          path: astraplay-windows-x64-development.msix
          retention-days: 7
          if-no-files-found: error

      - name: Compile .ISS to .EXE Installer
        uses: Minionguyjpro/Inno-Setup-Action@v1.2.9
        with:
          path: "scripts/astraplay.iss"
          options: /O+

      - name: Rename installer with version
        run: |
          INSTALLER_NAME="astraplay-windows-x64-installer-${{ steps.extract_version.outputs.version }}.exe"
          cp astraplay-windows-installer.exe "${INSTALLER_NAME}"
          echo "INSTALLER_NAME=${INSTALLER_NAME}" >> $GITHUB_ENV

      - name: Upload installer artifact
        uses: actions/upload-artifact@v7
        with:
          name: AstraPlay-Windows-x64-${{ steps.extract_version.outputs.version }}-${{ env.SHORT_SHA }}.exe
          path: ${{ env.INSTALLER_NAME }}
          retention-days: 14
          if-no-files-found: error

      - name: Upload portable zip artifact
        uses: actions/upload-artifact@v7
        with:
          name: AstraPlay-Windows-x64-${{ steps.extract_version.outputs.version }}-${{ env.SHORT_SHA }}.zip
          path: astraplay-windows-x64.zip
          retention-days: 14
          if-no-files-found: error

  # =========================================================================
  # WINDOWS ARM64
  # =========================================================================
  build-arm64:
    name: Build Windows ARM64 (artifact)
    if: inputs.arch == 'arm64' || inputs.arch == 'both'
    runs-on: windows-11-arm
    continue-on-error: true
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Disable autocrlf
        shell: pwsh
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf

      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: msys2/setup-msys2@v2
        with:
          msystem: clangarm64
          update: true
          install: git diffutils
          pacboy: >-
            ca-certificates:p
            cc:p
            cmake:p
            curl:p
            diffutils:p
            fast_float:p
            fftw:p
            json-c:p
            lcms2:p
            libdovi:p
            meson:p
            miniupnpc:p
            gcc:p
            nasm:p
            ninja:p
            openssl:p
            opus:p
            pkgconf:p
            protobuf:p
            python:p
            python-psutil:p
            python-glad:p
            python-jinja:p
            python-pip:p
            qt6-base:p
            qt6-declarative:p
            qt6-svg:p
            SDL2:p
            shaderc:p
            speexdsp:p
            spirv-cross:p
            vulkan:p
            vulkan-headers:p

      - name: Set short commit hash
        run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Install python protobuf and zip
        run: |
          pip install protobuf
          pacman -S git make unzip zip jq --noconfirm

      - name: Build libplacebo for ARM64
        run: |
          scripts/build-libplacebo-windows-arm.sh

      - name: Setup ffmpeg for ARM64
        run: |
          curl -LO https://github.com/streetpea/FFmpeg-Builds/releases/download/latest/ffmpeg-n7.1-latest-winarm64-gpl-shared-7.1.zip
          unzip ffmpeg-n7.1-latest-winarm64-gpl-shared-7.1.zip
          cp -a "ffmpeg-n7.1-latest-winarm64-gpl-shared-7.1/bin/." /clangarm64/bin
          cp -a "ffmpeg-n7.1-latest-winarm64-gpl-shared-7.1/include/." /clangarm64/include
          cp -a "ffmpeg-n7.1-latest-winarm64-gpl-shared-7.1/lib/." /clangarm64/lib

      - name: Add QmlWebEngine Import
        run: |
          cp scripts/qtwebengine_import.qml gui/src/qml/

      - name: Configure AstraPlay ARM64
        run: |
          cmake -S . -B build -G "Ninja" -DCMAKE_BUILD_TYPE=Release -DCHIAKI_ENABLE_CLI=OFF -DCHIAKI_ENABLE_STEAMDECK_NATIVE=OFF -DCHIAKI_ENABLE_STEAMWORKS=${{ env.CHIAKI_ENABLE_STEAMWORKS }} -DCHIAKI_ENABLE_STEAM_SHORTCUT=ON

      - name: Build AstraPlay ARM64
        run: |
          cmake --build build --config Release --clean-first --target astraplay

      - name: Package AstraPlay ARM64
        run: |
          mkdir -p astraplay
          [ -f build/gui/astraplay.exe ] && cp -f build/gui/astraplay.exe astraplay/astraplay.exe || cp -f build/gui/*.exe astraplay/astraplay.exe
          export PATH="${{ github.workspace }}/build/third-party/cpp-steam-tools:/clangarm64/share/qt6/bin/:/clangarm64/bin/:${PATH}"
          export QT_PLUGIN_PATH="/clangarm64/share/qt6/plugins"
          export QML2_IMPORT_PATH="/clangarm64/share/qt6/qml"
          echo astraplay/astraplay.exe > tmp0.txt
          while [ -e tmp0.txt ]
          do
            cp tmp0.txt tmp.txt
            rm tmp0.txt
            sort -u tmp.txt -o tmp.txt
            ldd $(<tmp.txt) | awk '($2 == "=>") { print $3 }' | while read -r dep; do
              case "$dep" in
                ""|*"/Windows/"*|*"/WINDOWS/"*|*"/System32/"*|*"/SYSTEM32/"*|*"/SysWOW64/"*|*"/SYSWOW64/"*)
                  continue
                  ;;
              esac
              if [ -f "$dep" ] && [ ! -e "astraplay/${dep##*/}" ]; then
                cp "$dep" astraplay/
                echo "$dep" >> tmp0.txt
              fi
            done
          done
          windeployqt6.exe --no-translations --qmldir=gui/src/qml astraplay/astraplay.exe
          find astraplay -type d \( -name plugins -o -name imageformats -o -name platforms -o -name sqldrivers \) -exec find {} -name "*.dll" \; | while read plugin; do
            echo "$plugin" >> tmp0.txt
          done
          while [ -e tmp0.txt ] && [ -s tmp0.txt ]
          do
            cp tmp0.txt tmp.txt
            rm tmp0.txt
            sort -u tmp.txt -o tmp.txt
            ldd $(<tmp.txt) 2>/dev/null | awk '($2 == "=>") { print $3 }' | while read -r dep; do
              case "$dep" in
                ""|*"/Windows/"*|*"/WINDOWS/"*|*"/System32/"*|*"/SYSTEM32/"*|*"/SysWOW64/"*|*"/SYSWOW64/"*)
                  continue
                  ;;
              esac
              if [ -f "$dep" ] && [ ! -e "astraplay/${dep##*/}" ]; then
                cp "$dep" astraplay/
                echo "$dep" >> tmp0.txt
              fi
            done
          done
          rm -f tmp0.txt tmp.txt

      - name: Create portable zip
        run: |
          zip -r astraplay-windows-arm64.zip astraplay

      - name: Extract version
        id: extract_version
        uses: ./.github/actions/extract-version

      - name: Build development MSIX
        shell: pwsh
        run: |
          python scripts/build-windows-msix.py astraplay-windows-arm64.zip "${{ steps.extract_version.outputs.version }}" arm64 astraplay-windows-arm64-development.msix

      - name: Upload unsigned development MSIX
        uses: actions/upload-artifact@v7
        with:
          name: AstraPlay-Windows-arm64-development-msix
          path: astraplay-windows-arm64-development.msix
          retention-days: 7
          if-no-files-found: error

      - name: Compile Inno Setup ARM64 Installer
        continue-on-error: true
        uses: Minionguyjpro/Inno-Setup-Action@v1.2.9
        with:
          path: "scripts/astraplay.iss"
          options: /O+

      - name: Rename ARM64 installer with version
        run: |
          INSTALLER_NAME="astraplay-windows-arm64-installer-${{ steps.extract_version.outputs.version }}.exe"
          if [ -f astraplay-windows-installer.exe ]; then
            cp astraplay-windows-installer.exe "${INSTALLER_NAME}"
            echo "INSTALLER_NAME=${INSTALLER_NAME}" >> $GITHUB_ENV
          fi

      - name: Upload ARM64 installer artifact
        if: env.INSTALLER_NAME != ''
        uses: actions/upload-artifact@v7
        with:
          name: AstraPlay-Windows-arm64-${{ steps.extract_version.outputs.version }}-${{ env.SHORT_SHA }}.exe
          path: ${{ env.INSTALLER_NAME }}
          retention-days: 14
          if-no-files-found: warn

      - name: Upload ARM64 portable zip artifact
        uses: actions/upload-artifact@v7
        with:
          name: AstraPlay-Windows-arm64-${{ steps.extract_version.outputs.version }}-${{ env.SHORT_SHA }}.zip
          path: astraplay-windows-arm64.zip
          retention-days: 14
          if-no-files-found: error
