name: Release on Merge

on:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Custom release tag (e.g. v2.11.5). Leave blank to auto-generate based on CMakeLists.txt version."
        required: false
        default: ""

permissions:
  contents: write
  actions: read

concurrency:
  group: release-on-merge-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # =========================================================================
  # 1. WINDOWS X86_64 BUILD (MSYS2 MinGW64 + Inno Setup)
  # =========================================================================
  build-windows-x64:
    name: Build Windows x86_64
    runs-on: windows-latest
    timeout-minutes: 35
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Disable autocrlf
        shell: pwsh
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: msys2/setup-msys2@v2
        with:
          msystem: mingw64
          update: true
          install: git diffutils
          pacboy: >-
            ca-certificates:p
            cc:p
            cmake:p
            curl:p
            fast_float:p
            fftw:p
            hidapi:p
            json-c:p
            lcms2:p
            libdovi:p
            meson:p
            miniupnpc:p
            gcc:p
            nasm:p
            ninja:p
            openssl:p
            opus:p
            pkgconf:p
            protobuf:p
            python:p
            python-psutil:p
            python-glad:p
            python-jinja:p
            python-pip:p
            qt6-base:p
            qt6-declarative:p
            qt6-svg:p
            SDL2:p
            shaderc:p
            speexdsp:p
            spirv-cross:p
            vulkan:p
            vulkan-headers:p

      - name: Install Python dependencies
        run: |
          pip install protobuf
          pacman -S git make unzip zip jq --noconfirm

      - name: Build libplacebo
        run: |
          scripts/build-libplacebo-windows.sh

      - name: Setup ffmpeg
        run: |
          curl -LO https://github.com/streetpea/FFmpeg-Builds/releases/download/latest/ffmpeg-n7.1-latest-win64-gpl-shared-7.1.zip
          unzip ffmpeg-n7.1-latest-win64-gpl-shared-7.1.zip
          cp -a "ffmpeg-n7.1-latest-win64-gpl-shared-7.1/bin/." /mingw64/bin
          cp -a "ffmpeg-n7.1-latest-win64-gpl-shared-7.1/include/." /mingw64/include
          cp -a "ffmpeg-n7.1-latest-win64-gpl-shared-7.1/lib/." /mingw64/lib

      - name: Add QmlWebEngine Import
        run: |
          cp scripts/qtwebengine_import.qml gui/src/qml/

      - name: Configure CMake
        run: |
          cmake -S . -B build -G "Ninja" -DCMAKE_BUILD_TYPE=Release -DCHIAKI_ENABLE_CLI=OFF -DCHIAKI_ENABLE_STEAMWORKS=OFF -DCHIAKI_ENABLE_STEAM_SHORTCUT=ON

      - name: Build AstraPlay
        run: |
          cmake --build build --config Release --clean-first --target chiaki

      - name: Package AstraPlay Runtime and Plugins
        run: |
          mkdir -p astraplay
          cp build/gui/chiaki.exe astraplay/astraplay.exe
          export PATH="${{ github.workspace }}/build/third-party/cpp-steam-tools:/mingw64/share/qt6/bin/:/mingw64/bin/:${PATH}"
          export QT_PLUGIN_PATH="/mingw64/share/qt6/plugins"
          export QML2_IMPORT_PATH="/mingw64/share/qt6/qml"
          echo astraplay/astraplay.exe > tmp0.txt
          while [ -e tmp0.txt ]
          do
            cp tmp0.txt tmp.txt
            rm tmp0.txt
            sort -u tmp.txt -o tmp.txt
            ldd $(<tmp.txt) | awk '($2 == "=>") { print $3 }' | while read -r dep; do
              case "$dep" in
                ""|*"/Windows/"*|*"/WINDOWS/"*|*"/System32/"*|*"/SYSTEM32/"*|*"/SysWOW64/"*|*"/SYSWOW64/"*)
                  continue
                  ;;
              esac
              if [ -f "$dep" ] && [ ! -e "astraplay/${dep##*/}" ]; then
                echo "Copied $dep"
                cp "$dep" astraplay/
                echo "$dep" >> tmp0.txt
              fi
            done
          done
          windeployqt6.exe --no-translations --qmldir=gui/src/qml astraplay/astraplay.exe
          rm -f tmp0.txt tmp.txt

      - name: Create Portable Zip
        run: |
          zip -r astraplay.zip astraplay

      - name: Compile Inno Setup Installer
        uses: Minionguyjpro/Inno-Setup-Action@v1.2.2
        with:
          path: "scripts/chiaki-ng.iss"
          options: /O+

      - name: Stage Windows x64 Artifacts
        run: |
          mkdir -p windows_staging
          cp astraplay/astraplay.exe windows_staging/
          cp astraplay.zip windows_staging/
          cp astraplay-windows-installer.exe windows_staging/

      - name: Upload Windows x64 Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: astraplay-windows-x64-build
          path: windows_staging/
          retention-days: 7
          if-no-files-found: error

  # =========================================================================
  # 2. WINDOWS ARM64 BUILD (MSYS2 ClangARM64 + Inno Setup)
  # =========================================================================
  build-windows-arm64:
    name: Build Windows ARM64
    runs-on: windows-11-arm
    continue-on-error: true
    timeout-minutes: 35
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Disable autocrlf
        shell: pwsh
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: msys2/setup-msys2@v2
        with:
          msystem: clangarm64
          update: true
          install: git diffutils
          pacboy: >-
            ca-certificates:p
            cc:p
            cmake:p
            curl:p
            diffutils:p
            fast_float:p
            fftw:p
            hidapi:p
            json-c:p
            lcms2:p
            libdovi:p
            meson:p
            miniupnpc:p
            gcc:p
            nasm:p
            ninja:p
            openssl:p
            opus:p
            pkgconf:p
            protobuf:p
            python:p
            python-psutil:p
            python-glad:p
            python-jinja:p
            python-pip:p
            qt6-base:p
            qt6-declarative:p
            qt6-svg:p
            SDL2:p
            shaderc:p
            speexdsp:p
            spirv-cross:p
            vulkan:p
            vulkan-headers:p

      - name: Install Python dependencies
        run: |
          pip install protobuf
          pacman -S git make unzip zip jq --noconfirm

      - name: Build libplacebo for ARM64
        run: |
          scripts/build-libplacebo-windows-arm.sh

      - name: Setup ffmpeg for ARM64
        run: |
          curl -LO https://github.com/streetpea/FFmpeg-Builds/releases/download/latest/ffmpeg-n7.1-latest-winarm64-gpl-shared-7.1.zip
          unzip ffmpeg-n7.1-latest-winarm64-gpl-shared-7.1.zip
          cp -a "ffmpeg-n7.1-latest-winarm64-gpl-shared-7.1/bin/." /clangarm64/bin
          cp -a "ffmpeg-n7.1-latest-winarm64-gpl-shared-7.1/include/." /clangarm64/include
          cp -a "ffmpeg-n7.1-latest-winarm64-gpl-shared-7.1/lib/." /clangarm64/lib

      - name: Add QmlWebEngine Import
        run: |
          cp scripts/qtwebengine_import.qml gui/src/qml/

      - name: Configure CMake
        run: |
          cmake -S . -B build -G "Ninja" -DCMAKE_BUILD_TYPE=Release -DCHIAKI_ENABLE_CLI=OFF -DCHIAKI_ENABLE_STEAMWORKS=OFF -DCHIAKI_ENABLE_STEAM_SHORTCUT=ON

      - name: Build AstraPlay ARM64
        run: |
          cmake --build build --config Release --clean-first --target chiaki

      - name: Package AstraPlay ARM64 Runtime
        run: |
          mkdir -p astraplay
          cp build/gui/chiaki.exe astraplay/astraplay.exe
          export PATH="${{ github.workspace }}/build/third-party/cpp-steam-tools:/clangarm64/share/qt6/bin/:/clangarm64/bin/:${PATH}"
          export QT_PLUGIN_PATH="/clangarm64/share/qt6/plugins"
          export QML2_IMPORT_PATH="/clangarm64/share/qt6/qml"
          echo astraplay/astraplay.exe > tmp0.txt
          while [ -e tmp0.txt ]
          do
            cp tmp0.txt tmp.txt
            rm tmp0.txt
            sort -u tmp.txt -o tmp.txt
            ldd $(<tmp.txt) | awk '($2 == "=>") { print $3 }' | while read -r dep; do
              case "$dep" in
                ""|*"/Windows/"*|*"/WINDOWS/"*|*"/System32/"*|*"/SYSTEM32/"*|*"/SysWOW64/"*|*"/SYSWOW64/"*)
                  continue
                  ;;
              esac
              if [ -f "$dep" ] && [ ! -e "astraplay/${dep##*/}" ]; then
                cp "$dep" astraplay/
                echo "$dep" >> tmp0.txt
              fi
            done
          done
          windeployqt6.exe --no-translations --qmldir=gui/src/qml astraplay/astraplay.exe
          rm -f tmp0.txt tmp.txt
          zip -r astraplay-windows-arm64.zip astraplay

      - name: Compile Inno Setup ARM64 Installer
        continue-on-error: true
        uses: Minionguyjpro/Inno-Setup-Action@v1.2.2
        with:
          path: "scripts/chiaki-ng.iss"
          options: /O+

      - name: Stage Windows ARM64 Artifacts
        run: |
          mkdir -p windows_arm64_staging
          cp astraplay/astraplay.exe windows_arm64_staging/astraplay-windows-arm64.exe
          cp astraplay-windows-arm64.zip windows_arm64_staging/
          if [ -f astraplay-windows-installer.exe ]; then
            cp astraplay-windows-installer.exe windows_arm64_staging/astraplay-windows-arm64-installer.exe
          fi

      - name: Upload Windows ARM64 Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: astraplay-windows-arm64-build
          path: windows_arm64_staging/
          retention-days: 7
          if-no-files-found: error

  # =========================================================================
  # 3. MACOS APPLE SILICON BUILD (M1/M2/M3/M4 .dmg + .zip)
  # =========================================================================
  build-macos-arm64:
    name: Build macOS Apple Silicon (arm64)
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build macOS Apple Silicon Bundle
        run: bash scripts/build-macos.sh arm64 --ad-hoc --no-credentials-file --no-notarize --skip-notary-keychain

      - name: Package Apple Silicon DMG and Zip
        working-directory: build-output
        run: |
          if [ ! -f "AstraPlay.dmg" ] && [ -d "AstraPlay.app" ]; then
            hdiutil create -srcfolder "AstraPlay.app" -volname "AstraPlay" "AstraPlay.dmg"
          fi
          zip -ry AstraPlay-macOS.zip AstraPlay.app
          mkdir -p macos_staging
          cp AstraPlay.dmg macos_staging/AstraPlay-macOS-arm64.dmg
          cp AstraPlay.dmg macos_staging/AstraPlay-macOS.dmg
          cp AstraPlay-macOS.zip macos_staging/AstraPlay-macOS-arm64.zip
          cp AstraPlay-macOS.zip macos_staging/AstraPlay-macOS.zip

      - name: Upload macOS Apple Silicon Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: astraplay-macos-arm64-build
          path: build-output/macos_staging/
          retention-days: 7
          if-no-files-found: error

  # =========================================================================
  # 4. MACOS INTEL BUILD (x86_64 .dmg + .zip)
  # =========================================================================
  build-macos-intel:
    name: Build macOS Intel (x86_64)
    runs-on: macos-15-intel
    continue-on-error: true
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build macOS Intel Bundle
        run: bash scripts/build-macos.sh x86_64 --ad-hoc --no-credentials-file --no-notarize --skip-notary-keychain

      - name: Package Intel DMG and Zip
        working-directory: build-output
        run: |
          if [ ! -f "AstraPlay.dmg" ] && [ -d "AstraPlay.app" ]; then
            hdiutil create -srcfolder "AstraPlay.app" -volname "AstraPlay" "AstraPlay.dmg"
          fi
          zip -ry AstraPlay-macOS-x86_64.zip AstraPlay.app
          mkdir -p macos_intel_staging
          cp AstraPlay.dmg macos_intel_staging/AstraPlay-macOS-x86_64.dmg
          cp AstraPlay-macOS-x86_64.zip macos_intel_staging/

      - name: Upload macOS Intel Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: astraplay-macos-intel-build
          path: build-output/macos_intel_staging/
          retention-days: 7
          if-no-files-found: error

  # =========================================================================
  # 5a. LINUX X86_64 BUILD (SteamOS / Bazzite / AppImage + Portable Zip)
  # =========================================================================
  build-linux-x64:
    name: Build Linux x86_64
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Install Podman and Tools
        run: sudo apt-get update && sudo apt-get -y install podman zip jq

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          path: astraplay

      - name: Add QmlWebEngine import
        working-directory: astraplay
        run: cp scripts/qtwebengine_import.qml gui/src/qml/

      - name: Build in Container
        working-directory: astraplay
        run: |
          podman run --rm \
            -v "$PWD:/build/chiaki" \
            -w "/build/chiaki" \
            --device /dev/fuse \
            --cap-add SYS_ADMIN \
            -t docker.io/streetpea/chiaki-ng-builder:qt6.9 \
            /bin/bash -c "sudo -E scripts/build-appimage.sh /build/appdir"

      - name: Package Linux Portable Zip
        working-directory: astraplay/appimage
        run: |
          zip -r astraplay-linux-x86_64.zip astraplay
          mkdir -p linux_staging
          cp astraplay.AppImage linux_staging/AstraPlay-Linux-x86_64.AppImage
          cp astraplay-linux-x86_64.zip linux_staging/

      - name: Upload Linux x86_64 Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: astraplay-linux-build
          path: astraplay/appimage/linux_staging/
          retention-days: 7
          if-no-files-found: error

  # =========================================================================
  # 5b. LINUX ARM64 BUILD (Raspberry Pi 5 / ARM Linux SBCs & Handhelds)
  # =========================================================================
  build-linux-arm64:
    name: Build Linux ARM64 (aarch64)
    runs-on: ubuntu-24.04-arm
    continue-on-error: true
    timeout-minutes: 35
    steps:
      - name: Install Podman and Tools
        run: sudo apt-get update && sudo apt-get -y install podman zip jq

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          path: astraplay

      - name: Add QmlWebEngine import
        working-directory: astraplay
        run: cp scripts/qtwebengine_import.qml gui/src/qml/

      - name: Build in Container
        working-directory: astraplay
        run: |
          podman run --rm \
            -v "$PWD:/build/chiaki" \
            -w "/build/chiaki" \
            --device /dev/fuse \
            --cap-add SYS_ADMIN \
            -t docker.io/streetpea/chiaki-ng-builder:qt6.9 \
            /bin/bash -c "sudo -E scripts/build-appimage.sh /build/appdir"

      - name: Package Linux ARM64 Portable Zip
        working-directory: astraplay/appimage
        run: |
          zip -r astraplay-linux-aarch64.zip astraplay
          mkdir -p linux_arm64_staging
          cp astraplay.AppImage linux_arm64_staging/AstraPlay-Linux-aarch64.AppImage
          cp astraplay-linux-aarch64.zip linux_arm64_staging/

      - name: Upload Linux ARM64 Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: astraplay-linux-arm64-build
          path: astraplay/appimage/linux_arm64_staging/
          retention-days: 7
          if-no-files-found: error

  # =========================================================================
  # 6. ANDROID BUILD (Sideloadable Debug APK)
  # =========================================================================
  build-android:
    name: Build Android
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          yes | sdkmanager --licenses || true

      - name: Install NDK and Tools
        run: |
          sdkmanager --install \
            "ndk;28.2.13676358" \
            "cmake;3.30.4" \
            "build-tools;35.0.0" \
            "platforms;android-35"

      - name: Install Protobuf
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq protobuf-compiler
          pip3 install 'protobuf>=5,<6' 'grpcio-tools>=1.60'

      - name: Write local.properties
        working-directory: android
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Setup Android Keystore (if secret present)
        working-directory: android
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Decoding release keystore from secrets..."
            echo "$KEYSTORE_BASE64" | base64 --decode > release.keystore
            echo "ANDROID_KEYSTORE_FILE=$(pwd)/release.keystore" >> "$GITHUB_ENV"
            echo "ANDROID_KEYSTORE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_PASSWORD=${{ secrets.ANDROID_KEY_PASSWORD }}" >> "$GITHUB_ENV"
          else
            echo "No release keystore secret configured; building debug APK."
          fi

      - name: Build Android Packages (APK and AAB)
        working-directory: android
        run: |
          if [ -n "$ANDROID_KEYSTORE_FILE" ] && [ -f "$ANDROID_KEYSTORE_FILE" ]; then
            ./gradlew assembleRelease bundleRelease \
              --parallel \
              --build-cache \
              -Dorg.gradle.java.home="$JAVA_HOME"
          else
            ./gradlew assembleDebug \
              --parallel \
              --build-cache \
              -Dorg.gradle.java.home="$JAVA_HOME"
          fi

      - name: Stage Android Artifact
        run: |
          mkdir -p android_staging
          APK_SRC=$(find android/app/build/outputs/apk -name "*.apk" | head -n 1)
          if [ -n "$APK_SRC" ]; then
            cp "$APK_SRC" android_staging/AstraPlay-Android.apk
          fi
          AAB_SRC=$(find android/app/build/outputs/bundle -name "*.aab" 2>/dev/null | head -n 1 || true)
          if [ -n "$AAB_SRC" ]; then
            cp "$AAB_SRC" android_staging/AstraPlay-Android.aab
          fi

      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: astraplay-android-build
          path: android_staging/
          retention-days: 7
          if-no-files-found: warn

  # =========================================================================
  # 7. IOS BUILD (Unsigned Sideloadable IPA)
  # =========================================================================
  build-ios:
    name: Build iOS Unsigned IPA
    runs-on: macos-latest
    continue-on-error: true
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Extract version
        id: extract_version
        uses: ./.github/actions/extract-version

      - name: Install build dependencies
        run: |
          retry() {
            local attempts="$1"
            shift
            local n=1
            until "$@"; do
              if [ "$n" -ge "$attempts" ]; then
                echo "Command failed after $n attempts: $*"
                return 1
              fi
              local sleep_s=$((n * 15))
              echo "Attempt $n failed; retrying in ${sleep_s}s: $*"
              sleep "$sleep_s"
              n=$((n + 1))
            done
          }
          retry 4 brew install cmake ninja protobuf@29 python-setuptools
          pip3 install --user --break-system-packages 'protobuf>=5,<6' 2>/dev/null || pip3 install 'protobuf>=5,<6'
          echo "$(brew --prefix)/opt/protobuf@29/bin" >> "$GITHUB_PATH"

      - name: Download iOS toolchain
        working-directory: ios
        run: |
          if [ ! -f ios.toolchain.cmake ]; then
            curl -sL -o ios.toolchain.cmake \
              https://raw.githubusercontent.com/leetal/ios-cmake/master/ios.toolchain.cmake
          fi

      - name: Build chiaki-lib
        working-directory: ios
        run: |
          cmake -S . -B build-iphoneos -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=ios.toolchain.cmake \
            -DPLATFORM=OS64 \
            -DCMAKE_BUILD_TYPE=Release \
            -DUSE_LIBIDN2=OFF \
            -DCURL_USE_LIBPSL=OFF \
            -DUSE_NGHTTP2=OFF \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5
          cmake --build build-iphoneos --config Release --target chiaki-lib

      - name: Create combined static library
        working-directory: ios
        run: |
          find build-iphoneos -name "*.a" -print0 | \
            xargs -0 libtool -static -o build-iphoneos/libchiaki_complete.a

      - name: Set iOS marketing + build numbers
        run: |
          echo "IOS_MARKETING_VERSION=${{ steps.extract_version.outputs.version }}" >> "$GITHUB_ENV"
          echo "IOS_CURRENT_PROJECT_VERSION=${{ steps.extract_version.outputs.semver_build_id }}" >> "$GITHUB_ENV"

      - name: Archive (unsigned)
        working-directory: ios
        run: |
          xcodebuild -project AstraPlay.xcodeproj \
            -scheme AstraPlay \
            -sdk iphoneos \
            -configuration Release \
            archive \
            -destination 'generic/platform=iOS' \
            -archivePath build-derived/AstraPlay.xcarchive \
            -derivedDataPath build-derived \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            MARKETING_VERSION="${IOS_MARKETING_VERSION}" \
            CURRENT_PROJECT_VERSION="${IOS_CURRENT_PROJECT_VERSION}"

      - name: Package unsigned .ipa
        working-directory: ios
        run: |
          APP=$(find build-derived/AstraPlay.xcarchive/Products/Applications \
            -maxdepth 1 -name "*.app" | head -1)
          if [ -z "$APP" ] || [ ! -d "$APP" ]; then
            echo "::error::No .app found in archive — cannot build .ipa"
            exit 1
          fi
          rm -rf payload-staging && mkdir -p payload-staging/Payload
          cp -R "$APP" payload-staging/Payload/
          ( cd payload-staging && zip -ry "../AstraPlay-unsigned.ipa" Payload )

      - name: Stage iOS Artifact
        run: |
          mkdir -p ios_staging
          cp ios/AstraPlay-unsigned.ipa ios_staging/AstraPlay-iOS.ipa

      - name: Upload iOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: astraplay-ios-build
          path: ios_staging/
          retention-days: 7
          if-no-files-found: warn

  # =========================================================================
  # 8. PUBLISH MULTI-PLATFORM RELEASE
  # =========================================================================
  release:
    name: Create Release Tag and Publish Binaries
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs:
      - build-windows-x64
      - build-windows-arm64
      - build-macos-arm64
      - build-macos-intel
      - build-linux-x64
      - build-linux-arm64
      - build-android
      - build-ios
    if: always() && !cancelled() && (needs.build-windows-x64.result == 'success' || needs.build-macos-arm64.result == 'success' || needs.build-linux-x64.result == 'success')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Inspect downloaded artifacts
        run: |
          echo "Downloaded artifact hierarchy:"
          find artifacts -maxdepth 3 -ls

      - name: Determine release version and tag
        id: versioning
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CUSTOM_TAG: ${{ github.event.inputs.tag_name }}
        run: |
          set -euo pipefail

          if [ -n "$CUSTOM_TAG" ]; then
            TAG="$CUSTOM_TAG"
            VER="${CUSTOM_TAG#v}"
          else
            MAJOR=$(grep '^set(CHIAKI_VERSION_MAJOR' CMakeLists.txt | awk '{print $2}' | tr -d ')')
            MINOR=$(grep '^set(CHIAKI_VERSION_MINOR' CMakeLists.txt | awk '{print $2}' | tr -d ')')
            PATCH=$(grep '^set(CHIAKI_VERSION_PATCH' CMakeLists.txt | awk '{print $2}' | tr -d ')')
            BASE_VER="${MAJOR}.${MINOR}.${PATCH}"

            if ! git rev-parse -q --verify "refs/tags/v${BASE_VER}" >/dev/null 2>&1 && ! gh release view "v${BASE_VER}" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              TAG="v${BASE_VER}"
              VER="${BASE_VER}"
            else
              N=1
              while git rev-parse -q --verify "refs/tags/v${BASE_VER}.${N}" >/dev/null 2>&1 || gh release view "v${BASE_VER}.${N}" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; do
                N=$((N + 1))
              done
              TAG="v${BASE_VER}.${N}"
              VER="${BASE_VER}.${N}"
            fi
          fi

          echo "Computed release tag: $TAG"
          echo "Computed version: $VER"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VER" >> "$GITHUB_OUTPUT"

      - name: Install Windows MSI builder
        run: |
          sudo apt-get update
          sudo apt-get install -y wixl msitools

      - name: Package all release assets
        run: |
          mkdir -p dist

          # 1. Windows x64 assets
          if [ -d artifacts/astraplay-windows-x64-build ]; then
            WIN_EXE=$(find artifacts/astraplay-windows-x64-build -maxdepth 2 -name "astraplay.exe" | head -n 1)
            if [ -n "$WIN_EXE" ]; then
              cp "$WIN_EXE" dist/astraplay.exe
              cp "$WIN_EXE" dist/astraplay-windows-x64.exe
              # Legacy alias for backward compatibility
              cp "$WIN_EXE" dist/astraplay.exe
            fi
            WIN_ZIP=$(find artifacts/astraplay-windows-x64-build -maxdepth 2 -name "*.zip" | head -n 1)
            if [ -n "$WIN_ZIP" ]; then
              cp "$WIN_ZIP" dist/astraplay-windows-x64.zip
            fi
            WIN_INST=$(find artifacts/astraplay-windows-x64-build -maxdepth 2 -name "*installer*.exe" | head -n 1)
            if [ -n "$WIN_INST" ]; then
              cp "$WIN_INST" dist/astraplay-windows-installer.exe
            fi
          fi

          # 2. Windows ARM64 assets
          if [ -d artifacts/astraplay-windows-arm64-build ]; then
            WIN_ARM_EXE=$(find artifacts/astraplay-windows-arm64-build -maxdepth 2 -name "*arm64.exe" | head -n 1)
            if [ -n "$WIN_ARM_EXE" ]; then
              cp "$WIN_ARM_EXE" dist/astraplay-windows-arm64.exe
            fi
            WIN_ARM_ZIP=$(find artifacts/astraplay-windows-arm64-build -maxdepth 2 -name "*arm64.zip" | head -n 1)
            if [ -n "$WIN_ARM_ZIP" ]; then
              cp "$WIN_ARM_ZIP" dist/astraplay-windows-arm64.zip
            fi
            WIN_ARM_INST=$(find artifacts/astraplay-windows-arm64-build -maxdepth 2 -name "*arm64-installer.exe" | head -n 1)
            if [ -n "$WIN_ARM_INST" ]; then
              cp "$WIN_ARM_INST" dist/astraplay-windows-arm64-installer.exe
            fi
          fi

          # 3. Build the MSI from the complete portable archive, including Qt runtime files.
          if [ -f dist/astraplay-windows-x64.zip ]; then
            python3 scripts/build-windows-msi.py \
              dist/astraplay-windows-x64.zip \
              "${{ steps.versioning.outputs.version }}" \
              dist/astraplay-windows-x64.msi
          fi

          # 4. macOS Apple Silicon assets
          if [ -d artifacts/astraplay-macos-arm64-build ]; then
            MAC_ARM_DMG=$(find artifacts/astraplay-macos-arm64-build -name "*arm64.dmg" -o -name "*.dmg" | head -n 1)
            if [ -n "$MAC_ARM_DMG" ]; then
              cp "$MAC_ARM_DMG" dist/AstraPlay-macOS-arm64.dmg
              cp "$MAC_ARM_DMG" dist/AstraPlay-macOS.dmg
            fi
            MAC_ARM_ZIP=$(find artifacts/astraplay-macos-arm64-build -name "*arm64.zip" -o -name "*.zip" | head -n 1)
            if [ -n "$MAC_ARM_ZIP" ]; then
              cp "$MAC_ARM_ZIP" dist/AstraPlay-macOS-arm64.zip
              cp "$MAC_ARM_ZIP" dist/AstraPlay-macOS.zip
            fi
          fi

          # 5. macOS Intel assets
          if [ -d artifacts/astraplay-macos-intel-build ]; then
            MAC_INTEL_DMG=$(find artifacts/astraplay-macos-intel-build -name "*x86_64.dmg" | head -n 1)
            if [ -n "$MAC_INTEL_DMG" ]; then
              cp "$MAC_INTEL_DMG" dist/AstraPlay-macOS-x86_64.dmg
            fi
            MAC_INTEL_ZIP=$(find artifacts/astraplay-macos-intel-build -name "*x86_64.zip" | head -n 1)
            if [ -n "$MAC_INTEL_ZIP" ]; then
              cp "$MAC_INTEL_ZIP" dist/AstraPlay-macOS-x86_64.zip
            fi
          fi

          # 6a. Linux x86_64 assets
          if [ -d artifacts/astraplay-linux-build ]; then
            LIN_AI=$(find artifacts/astraplay-linux-build -name "*.AppImage" | head -n 1)
            if [ -n "$LIN_AI" ]; then
              cp "$LIN_AI" dist/AstraPlay-Linux-x86_64.AppImage
            fi
            LIN_ZIP=$(find artifacts/astraplay-linux-build -name "*.zip" | head -n 1)
            if [ -n "$LIN_ZIP" ]; then
              cp "$LIN_ZIP" dist/AstraPlay-Linux-x86_64.zip
            fi
          fi

          # 6b. Linux ARM64 assets
          if [ -d artifacts/astraplay-linux-arm64-build ]; then
            LIN_ARM_AI=$(find artifacts/astraplay-linux-arm64-build -name "*.AppImage" | head -n 1)
            if [ -n "$LIN_ARM_AI" ]; then
              cp "$LIN_ARM_AI" dist/AstraPlay-Linux-aarch64.AppImage
            fi
            LIN_ARM_ZIP=$(find artifacts/astraplay-linux-arm64-build -name "*.zip" | head -n 1)
            if [ -n "$LIN_ARM_ZIP" ]; then
              cp "$LIN_ARM_ZIP" dist/AstraPlay-Linux-aarch64.zip
            fi
          fi

          # 7. Android assets
          AND_DIR=artifacts/astraplay-android-build
          if [ -d "$AND_DIR" ]; then
            AND_APK=$(find "$AND_DIR" -name "*.apk" | head -n 1)
            if [ -n "$AND_APK" ]; then
              cp "$AND_APK" dist/AstraPlay-Android.apk
            fi
            AND_AAB=$(find "$AND_DIR" -name "*.aab" | head -n 1)
            if [ -n "$AND_AAB" ]; then
              cp "$AND_AAB" dist/AstraPlay-Android.aab
            fi
          fi

          # 8. iOS assets
          if [ -d artifacts/astraplay-ios-build ]; then
            IOS_IPA=$(find artifacts/astraplay-ios-build -name "*.ipa" | head -n 1)
            if [ -n "$IOS_IPA" ]; then
              cp "$IOS_IPA" dist/AstraPlay-iOS.ipa
            fi
          fi

          # 9. Checksums
          cd dist
          sha256sum * > SHA256SUMS.txt
          cd ..

          echo "Final release assets prepared:"
          ls -lh dist/

      - name: Generate release notes
        id: notes
        run: |
          NOTES_FILE="${RUNNER_TEMP}/release_notes.md"
          TAG="${{ steps.versioning.outputs.tag }}"
          VER="${{ steps.versioning.outputs.version }}"

          PREV_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            CHANGES=$(git log "${PREV_TAG}..HEAD" --oneline --no-merges || git log -n 10 --oneline --no-merges)
          else
            CHANGES=$(git log -n 10 --oneline --no-merges)
          fi

          python3 scripts/generate_release_notes.py "$NOTES_FILE" "$TAG" "$VER" "$CHANGES"
          echo "notes_file=$NOTES_FILE" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release and Tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.versioning.outputs.tag }}
        run: |
          echo "Publishing release $TAG with all multi-platform assets..."
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target master \
            --title "AstraPlay ${TAG}" \
            --notes-file "${{ steps.notes.outputs.notes_file }}" \
            dist/*

          echo "Release $TAG published successfully with assets:"
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY"
