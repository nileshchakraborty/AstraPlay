name: Release on Merge

on:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Custom release tag (e.g. v2.11.5). Leave blank to auto-generate based on CMakeLists.txt version."
        required: false
        default: ""

permissions:
  contents: write
  actions: read

concurrency:
  group: release-on-merge-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # =========================================================================
  # 1. WINDOWS BUILD (MSYS2 MinGW64 + Inno Setup)
  # =========================================================================
  build-windows:
    name: Build Windows x86_64
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Disable autocrlf
        shell: pwsh
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: msys2/setup-msys2@v2
        with:
          msystem: mingw64
          update: true
          install: git diffutils
          pacboy: >-
            ca-certificates:p
            cc:p
            cmake:p
            curl:p
            fast_float:p
            fftw:p
            hidapi:p
            json-c:p
            lcms2:p
            libdovi:p
            meson:p
            miniupnpc:p
            gcc:p
            nasm:p
            ninja:p
            openssl:p
            opus:p
            pkgconf:p
            protobuf:p
            python:p
            python-psutil:p
            python-glad:p
            python-jinja:p
            python-pip:p
            qt6-base:p
            qt6-declarative:p
            qt6-svg:p
            SDL2:p
            shaderc:p
            speexdsp:p
            spirv-cross:p
            vulkan:p
            vulkan-headers:p

      - name: Install Python dependencies
        run: |
          pip install protobuf
          pacman -S git make unzip zip jq --noconfirm

      - name: Build libplacebo
        run: |
          scripts/build-libplacebo-windows.sh

      - name: Setup ffmpeg
        run: |
          curl -LO https://github.com/streetpea/FFmpeg-Builds/releases/download/latest/ffmpeg-n7.1-latest-win64-gpl-shared-7.1.zip
          unzip ffmpeg-n7.1-latest-win64-gpl-shared-7.1.zip
          cp -a "ffmpeg-n7.1-latest-win64-gpl-shared-7.1/bin/." /mingw64/bin
          cp -a "ffmpeg-n7.1-latest-win64-gpl-shared-7.1/include/." /mingw64/include
          cp -a "ffmpeg-n7.1-latest-win64-gpl-shared-7.1/lib/." /mingw64/lib

      - name: Add QmlWebEngine Import
        run: |
          cp scripts/qtwebengine_import.qml gui/src/qml/

      - name: Configure CMake
        run: |
          cmake -S . -B build -G "Ninja" -DCMAKE_BUILD_TYPE=Release -DCHIAKI_ENABLE_CLI=OFF -DCHIAKI_ENABLE_STEAMWORKS=OFF -DCHIAKI_ENABLE_STEAM_SHORTCUT=ON

      - name: Build Pylux
        run: |
          cmake --build build --config Release --clean-first --target chiaki

      - name: Package Pylux Runtime and Plugins
        run: |
          mkdir -p pylux
          cp build/gui/chiaki.exe pylux/pylux.exe
          export PATH="${{ github.workspace }}/build/third-party/cpp-steam-tools:/mingw64/share/qt6/bin/:/mingw64/bin/:${PATH}"
          export QT_PLUGIN_PATH="/mingw64/share/qt6/plugins"
          export QML2_IMPORT_PATH="/mingw64/share/qt6/qml"
          echo pylux/pylux.exe > tmp0.txt
          while [ -e tmp0.txt ]
          do
            cp tmp0.txt tmp.txt
            rm tmp0.txt
            sort -u tmp.txt -o tmp.txt
            ldd $(<tmp.txt) | awk '($2 == "=>") { print $3 }' | while read -r dep; do
              case "$dep" in
                ""|*"/Windows/"*|*"/WINDOWS/"*|*"/System32/"*|*"/SYSTEM32/"*|*"/SysWOW64/"*|*"/SYSWOW64/"*)
                  continue
                  ;;
              esac
              if [ -f "$dep" ] && [ ! -e "pylux/${dep##*/}" ]; then
                echo "Copied $dep"
                cp "$dep" pylux/
                echo "$dep" >> tmp0.txt
              fi
            done
          done
          windeployqt6.exe --no-translations --qmldir=gui/src/qml pylux/pylux.exe
          find pylux -type d \( -name plugins -o -name imageformats -o -name platforms -o -name sqldrivers \) -exec find {} -name "*.dll" \; | while read plugin; do
            echo "$plugin" >> tmp0.txt
          done
          while [ -e tmp0.txt ] && [ -s tmp0.txt ]
          do
            cp tmp0.txt tmp.txt
            rm tmp0.txt
            sort -u tmp.txt -o tmp.txt
            ldd $(<tmp.txt) 2>/dev/null | awk '($2 == "=>") { print $3 }' | while read -r dep; do
              case "$dep" in
                ""|*"/Windows/"*|*"/WINDOWS/"*|*"/System32/"*|*"/SYSTEM32/"*|*"/SysWOW64/"*|*"/SYSWOW64/"*)
                  continue
                  ;;
              esac
              if [ -f "$dep" ] && [ ! -e "pylux/${dep##*/}" ]; then
                cp "$dep" pylux/
                echo "$dep" >> tmp0.txt
              fi
            done
          done
          rm -f tmp0.txt tmp.txt

      - name: Create Portable Zip
        run: |
          zip -r pylux.zip pylux

      - name: Compile Inno Setup Installer
        uses: Minionguyjpro/Inno-Setup-Action@v1.2.2
        with:
          path: "scripts/chiaki-ng.iss"
          options: /O+

      - name: Stage Windows Artifacts
        run: |
          mkdir -p windows_staging
          cp pylux/pylux.exe windows_staging/
          cp pylux.zip windows_staging/
          cp pylux-windows-installer.exe windows_staging/

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pylux-windows-build
          path: windows_staging/
          retention-days: 7
          if-no-files-found: error

  # =========================================================================
  # 2. MACOS BUILD (Apple Silicon .app + .dmg + .zip)
  # =========================================================================
  build-macos:
    name: Build macOS Apple Silicon
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build macOS Bundle
        run: bash scripts/build-macos.sh arm64 --ad-hoc --no-credentials-file --no-notarize --skip-notary-keychain

      - name: Package DMG and Zip
        working-directory: build-output
        run: |
          if [ ! -f "Pylux.dmg" ] && [ -d "Pylux.app" ]; then
            hdiutil create -srcfolder "Pylux.app" -volname "Pylux" "Pylux.dmg"
          fi
          zip -ry Pylux-macOS.zip Pylux.app
          mkdir -p macos_staging
          cp Pylux.dmg macos_staging/
          cp Pylux-macOS.zip macos_staging/

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pylux-macos-build
          path: build-output/macos_staging/
          retention-days: 7
          if-no-files-found: error

  # =========================================================================
  # 3. LINUX BUILD (SteamOS / Bazzite / AppImage + Portable Zip)
  # =========================================================================
  build-linux:
    name: Build Linux x86_64
    runs-on: ubuntu-latest
    steps:
      - name: Install Podman and Tools
        run: sudo apt-get update && sudo apt-get -y install podman zip jq

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          path: pylux

      - name: Add QmlWebEngine import
        working-directory: pylux
        run: cp scripts/qtwebengine_import.qml gui/src/qml/

      - name: Build in Container
        working-directory: pylux
        run: |
          podman run --rm \
            -v "$PWD:/build/chiaki" \
            -w "/build/chiaki" \
            --device /dev/fuse \
            --cap-add SYS_ADMIN \
            -t docker.io/streetpea/chiaki-ng-builder:qt6.9 \
            /bin/bash -c "sudo -E scripts/build-appimage.sh /build/appdir"

      - name: Package Linux Portable Zip
        working-directory: pylux/appimage
        run: |
          zip -r pylux-linux-x86_64.zip pylux
          mkdir -p linux_staging
          cp pylux.AppImage linux_staging/Pylux-Linux-x86_64.AppImage
          cp pylux-linux-x86_64.zip linux_staging/

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pylux-linux-build
          path: pylux/appimage/linux_staging/
          retention-days: 7
          if-no-files-found: error

  # =========================================================================
  # 4. ANDROID BUILD (Sideloadable Debug APK)
  # =========================================================================
  build-android:
    name: Build Android
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK and Tools
        run: |
          sdkmanager --install \
            "ndk;28.2.13676358" \
            "cmake;3.30.4" \
            "build-tools;35.0.0" \
            "platforms;android-35"

      - name: Install Protobuf
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq protobuf-compiler
          pip3 install 'protobuf>=5,<6' 'grpcio-tools>=1.60'

      - name: Write local.properties
        working-directory: android
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      - name: Build Debug APK
        working-directory: android
        run: |
          ./gradlew assembleDebug \
            --parallel \
            --build-cache \
            -Dorg.gradle.java.home="$JAVA_HOME"

      - name: Stage Android Artifact
        run: |
          mkdir -p android_staging
          APK_SRC=$(find android/app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          cp "$APK_SRC" android_staging/Pylux-Android.apk

      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pylux-android-build
          path: android_staging/
          retention-days: 7
          if-no-files-found: error

  # =========================================================================
  # 5. IOS BUILD (Unsigned Sideloadable IPA)
  # =========================================================================
  build-ios:
    name: Build iOS Unsigned IPA
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Extract version
        id: extract_version
        uses: ./.github/actions/extract-version

      - name: Install build dependencies
        run: |
          retry() {
            local attempts="$1"
            shift
            local n=1
            until "$@"; do
              if [ "$n" -ge "$attempts" ]; then
                echo "Command failed after $n attempts: $*"
                return 1
              fi
              local sleep_s=$((n * 15))
              echo "Attempt $n failed; retrying in ${sleep_s}s: $*"
              sleep "$sleep_s"
              n=$((n + 1))
            done
          }
          retry 4 brew install cmake ninja protobuf@29 python-setuptools
          pip3 install --user --break-system-packages 'protobuf>=5,<6' 2>/dev/null || pip3 install 'protobuf>=5,<6'
          echo "$(brew --prefix)/opt/protobuf@29/bin" >> "$GITHUB_PATH"

      - name: Download iOS toolchain
        working-directory: ios
        run: |
          if [ ! -f ios.toolchain.cmake ]; then
            curl -sL -o ios.toolchain.cmake \
              https://raw.githubusercontent.com/leetal/ios-cmake/master/ios.toolchain.cmake
          fi

      - name: Build chiaki-lib
        working-directory: ios
        run: |
          cmake -S . -B build-iphoneos -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=ios.toolchain.cmake \
            -DPLATFORM=OS64 \
            -DCMAKE_BUILD_TYPE=Release \
            -DUSE_LIBIDN2=OFF \
            -DCURL_USE_LIBPSL=OFF \
            -DUSE_NGHTTP2=OFF \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5
          cmake --build build-iphoneos --config Release --target chiaki-lib

      - name: Create combined static library
        working-directory: ios
        run: |
          find build-iphoneos -name "*.a" -print0 | \
            xargs -0 libtool -static -o build-iphoneos/libchiaki_complete.a

      - name: Set iOS marketing + build numbers
        run: |
          echo "IOS_MARKETING_VERSION=${{ steps.extract_version.outputs.version }}" >> "$GITHUB_ENV"
          echo "IOS_CURRENT_PROJECT_VERSION=${{ steps.extract_version.outputs.semver_build_id }}" >> "$GITHUB_ENV"

      - name: Archive (unsigned)
        working-directory: ios
        run: |
          xcodebuild -project Pylux.xcodeproj \
            -scheme Pylux \
            -sdk iphoneos \
            -configuration Release \
            archive \
            -destination 'generic/platform=iOS' \
            -archivePath build-derived/Pylux.xcarchive \
            -derivedDataPath build-derived \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            MARKETING_VERSION="${IOS_MARKETING_VERSION}" \
            CURRENT_PROJECT_VERSION="${IOS_CURRENT_PROJECT_VERSION}"

      - name: Package unsigned .ipa
        working-directory: ios
        run: |
          APP=$(find build-derived/Pylux.xcarchive/Products/Applications \
            -maxdepth 1 -name "*.app" | head -1)
          if [ -z "$APP" ] || [ ! -d "$APP" ]; then
            echo "::error::No .app found in archive — cannot build .ipa"
            exit 1
          fi
          rm -rf payload-staging && mkdir -p payload-staging/Payload
          cp -R "$APP" payload-staging/Payload/
          ( cd payload-staging && zip -ry "../Pylux-unsigned.ipa" Payload )

      - name: Stage iOS Artifact
        run: |
          mkdir -p ios_staging
          cp ios/Pylux-unsigned.ipa ios_staging/Pylux-iOS.ipa

      - name: Upload iOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pylux-ios-build
          path: ios_staging/
          retention-days: 7
          if-no-files-found: error

  # =========================================================================
  # 6. PUBLISH MULTI-PLATFORM RELEASE
  # =========================================================================
  release:
    name: Create Release Tag and Publish Binaries
    runs-on: ubuntu-latest
    needs: [build-windows, build-macos, build-linux, build-android, build-ios]
    if: always() && !cancelled() && (needs.build-windows.result == 'success' || needs.build-macos.result == 'success' || needs.build-linux.result == 'success')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Inspect downloaded artifacts
        run: |
          echo "Downloaded artifact hierarchy:"
          find artifacts -maxdepth 3 -ls

      - name: Determine release version and tag
        id: versioning
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CUSTOM_TAG: ${{ github.event.inputs.tag_name }}
        run: |
          set -euo pipefail

          if [ -n "$CUSTOM_TAG" ]; then
            TAG="$CUSTOM_TAG"
            VER="${CUSTOM_TAG#v}"
          else
            MAJOR=$(grep '^set(CHIAKI_VERSION_MAJOR' CMakeLists.txt | awk '{print $2}' | tr -d ')')
            MINOR=$(grep '^set(CHIAKI_VERSION_MINOR' CMakeLists.txt | awk '{print $2}' | tr -d ')')
            PATCH=$(grep '^set(CHIAKI_VERSION_PATCH' CMakeLists.txt | awk '{print $2}' | tr -d ')')
            BASE_VER="${MAJOR}.${MINOR}.${PATCH}"

            if ! git rev-parse -q --verify "refs/tags/v${BASE_VER}" >/dev/null 2>&1 && ! gh release view "v${BASE_VER}" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              TAG="v${BASE_VER}"
              VER="${BASE_VER}"
            else
              N=1
              while git rev-parse -q --verify "refs/tags/v${BASE_VER}.${N}" >/dev/null 2>&1 || gh release view "v${BASE_VER}.${N}" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; do
                N=$((N + 1))
              done
              TAG="v${BASE_VER}.${N}"
              VER="${BASE_VER}.${N}"
            fi
          fi

          echo "Computed release tag: $TAG"
          echo "Computed version: $VER"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VER" >> "$GITHUB_OUTPUT"

      - name: Package all release assets
        run: |
          mkdir -p dist

          # 1. Windows assets
          if [ -d artifacts/pylux-windows-build ]; then
            WIN_EXE=$(find artifacts/pylux-windows-build -maxdepth 2 -name "pylux.exe" | head -n 1)
            if [ -n "$WIN_EXE" ]; then
              cp "$WIN_EXE" dist/pylux.exe
              cp "$WIN_EXE" dist/pylux-windows-x64.exe
            fi
            WIN_ZIP=$(find artifacts/pylux-windows-build -maxdepth 2 -name "pylux.zip" | head -n 1)
            if [ -n "$WIN_ZIP" ]; then
              cp "$WIN_ZIP" dist/pylux-windows-x64.zip
            fi
            WIN_INST=$(find artifacts/pylux-windows-build -maxdepth 2 -name "*installer*.exe" | head -n 1)
            if [ -n "$WIN_INST" ]; then
              cp "$WIN_INST" dist/pylux-windows-installer.exe
            fi
          fi

          # 2. Windows MSI installer generation (wixl)
          if [ -f dist/pylux.exe ]; then
            sudo apt-get update && sudo apt-get install -y msitools || true
            if command -v wixl >/dev/null 2>&1; then
              VER_RAW="${{ steps.versioning.outputs.version }}"
              MSI_VER=$(echo "$VER_RAW" | awk -F. '{printf "%d.%d.%d", ($1 ? $1 : 1), ($2 ? $2 : 0), ($3 ? $3 : 0)}')
              echo "Compiling MSI installer with wixl for version ${MSI_VER}..."
              wixl -v -D SourceExe="dist/pylux.exe" -D Version="${MSI_VER}" -o dist/pylux-windows-x64.msi scripts/pylux.wxs || echo "wixl failed, skipping MSI generation"
            fi
          fi

          # 3. macOS assets
          if [ -d artifacts/pylux-macos-build ]; then
            MAC_DMG=$(find artifacts/pylux-macos-build -name "*.dmg" | head -n 1)
            if [ -n "$MAC_DMG" ]; then
              cp "$MAC_DMG" dist/Pylux-macOS.dmg
            fi
            MAC_ZIP=$(find artifacts/pylux-macos-build -name "*.zip" | head -n 1)
            if [ -n "$MAC_ZIP" ]; then
              cp "$MAC_ZIP" dist/Pylux-macOS.zip
            fi
          fi

          # 4. Linux assets
          if [ -d artifacts/pylux-linux-build ]; then
            LIN_AI=$(find artifacts/pylux-linux-build -name "*.AppImage" | head -n 1)
            if [ -n "$LIN_AI" ]; then
              cp "$LIN_AI" dist/Pylux-Linux-x86_64.AppImage
            fi
            LIN_ZIP=$(find artifacts/pylux-linux-build -name "*.zip" | head -n 1)
            if [ -n "$LIN_ZIP" ]; then
              cp "$LIN_ZIP" dist/Pylux-Linux-x86_64.zip
            fi
          fi

          # 5. Android assets
          if [ -d artifacts/pylux-android-build ]; then
            AND_APK=$(find artifacts/pylux-android-build -name "*.apk" | head -n 1)
            if [ -n "$AND_APK" ]; then
              cp "$AND_APK" dist/Pylux-Android.apk
            fi
          fi

          # 6. iOS assets
          if [ -d artifacts/pylux-ios-build ]; then
            IOS_IPA=$(find artifacts/pylux-ios-build -name "*.ipa" | head -n 1)
            if [ -n "$IOS_IPA" ]; then
              cp "$IOS_IPA" dist/Pylux-iOS.ipa
            fi
          fi

          # 7. Checksums
          cd dist
          sha256sum * > SHA256SUMS.txt
          cd ..

          echo "Final release assets prepared:"
          ls -lh dist/

      - name: Generate release notes
        id: notes
        run: |
          NOTES_FILE="${RUNNER_TEMP}/release_notes.md"
          TAG="${{ steps.versioning.outputs.tag }}"
          VER="${{ steps.versioning.outputs.version }}"

          PREV_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            CHANGES=$(git log "${PREV_TAG}..HEAD" --oneline --no-merges || git log -n 10 --oneline --no-merges)
          else
            CHANGES=$(git log -n 10 --oneline --no-merges)
          fi

          python3 scripts/generate_release_notes.py "$NOTES_FILE" "$TAG" "$VER" "$CHANGES"
          echo "notes_file=$NOTES_FILE" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release and Tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.versioning.outputs.tag }}
        run: |
          echo "Publishing release $TAG with all multi-platform assets..."
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target master \
            --title "Pylux ${TAG}" \
            --notes-file "${{ steps.notes.outputs.notes_file }}" \
            dist/*

          echo "Release $TAG published successfully with assets:"
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY"
