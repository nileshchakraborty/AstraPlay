name: Inactive Issue Cleanup

on:
  schedule:
    - cron: '0 3 * * 0' # Weekly at 03:00 UTC on Sunday
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v11
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          days-before-issue-stale: 60
          days-before-issue-close: 14
          stale-issue-label: 'stale'
          stale-issue-message: 'This issue has been automatically marked as stale because it has not had recent activity. It will be closed in 14 days if no further activity occurs. Thank you for your contributions.'
          close-issue-message: 'This issue was closed because it has been inactive for 14 days since being marked as stale. Feel free to reopen or open a new issue if you are still experiencing this problem.'
          exempt-issue-labels: 'pinned,security,roadmap,confirmed,in-progress'
          days-before-pr-stale: -1
          days-before-pr-close: -1
