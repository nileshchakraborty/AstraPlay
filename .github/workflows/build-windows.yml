# Build Windows (x86_64, MSYS2/MinGW)
# Output: Portable zip + installer as run artifacts (published to the GitHub release).

name: Build Windows

on:
  workflow_dispatch:
  workflow_call:
    outputs:
      chiaki_version:
        description: AstraPlay version from CMakeLists.txt
        value: ${{ jobs.build-windows_x64-msys2.outputs.chiaki_version }}

concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: true

env:
  CHIAKI_ENABLE_STEAMWORKS: "OFF"
jobs:
  build-windows_x64-msys2:
    name: Build AstraPlay Windows x86_64
    runs-on: windows-latest
    outputs:
      chiaki_version: ${{ steps.extract_version.outputs.version }}
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Disable autocrlf
        shell: pwsh
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: msys2/setup-msys2@v2
        with:
          msystem: mingw64
          update: true
          install: git diffutils
          pacboy: >-
            ca-certificates:p
            cc:p
            cmake:p
            curl:p
            fast_float:p
            fftw:p
            hidapi:p
            json-c:p
            lcms2:p
            libdovi:p
            meson:p
            miniupnpc:p
            gcc:p
            nasm:p
            ninja:p
            openssl:p
            opus:p
            pkgconf:p
            protobuf:p
            python:p
            python-psutil:p
            python-glad:p
            python-jinja:p
            python-pip:p
            qt6-base:p
            qt6-declarative:p
            qt6-svg:p
            SDL2:p
            shaderc:p
            speexdsp:p
            spirv-cross:p
            vulkan:p
            vulkan-headers:p
            
      - name: Install python protobuf and zip
        run: |
          pip install protobuf
          pacman -S git make unzip zip jq --noconfirm

      - name: Build libbplacebo
        run: |
          scripts/build-libplacebo-windows.sh

      - name: Setup ffmpeg
        run: |
          curl -LO https://github.com/streetpea/FFmpeg-Builds/releases/download/latest/ffmpeg-n7.1-latest-win64-gpl-shared-7.1.zip
          unzip ffmpeg-n7.1-latest-win64-gpl-shared-7.1.zip
          cp -a "ffmpeg-n7.1-latest-win64-gpl-shared-7.1/bin/." /mingw64/bin
          cp -a "ffmpeg-n7.1-latest-win64-gpl-shared-7.1/include/." /mingw64/include
          cp -a "ffmpeg-n7.1-latest-win64-gpl-shared-7.1/lib/." /mingw64/lib

      - name: Add QmlWebEngine Import
        run: |
          cp scripts/qtwebengine_import.qml gui/src/qml/

      - name: Configure AstraPlay
        run: |
          cmake -S . -B build -G "Ninja" -DCMAKE_BUILD_TYPE=Release -DCHIAKI_ENABLE_CLI=OFF -DCHIAKI_ENABLE_STEAMWORKS=${{ env.CHIAKI_ENABLE_STEAMWORKS }} -DCHIAKI_ENABLE_STEAM_SHORTCUT=ON

      - name: Build AstraPlay
        run: |
          cmake --build build --config Release --clean-first --target astraplay
          
      - name: Package AstraPlay
        run: |
          mkdir -p astraplay
          [ -f build/gui/astraplay.exe ] && cp -f build/gui/astraplay.exe astraplay/astraplay.exe || cp -f build/gui/*.exe astraplay/astraplay.exe
          if [ "${{ env.CHIAKI_ENABLE_STEAMWORKS }}" = "ON" ]; then
            cp third-party/steamworks/steamworks_sdk/redistributable_bin/win64/steam_api64.dll astraplay/
            cp steam_appid.txt astraplay/ 2>/dev/null || echo "Warning: steam_appid.txt not found"
          fi
          export PATH="${{ github.workspace }}/build/third-party/cpp-steam-tools:/mingw64/share/qt6/bin/:/mingw64/bin/:${PATH}"
          export QT_PLUGIN_PATH="/mingw64/share/qt6/plugins"
          export QML2_IMPORT_PATH="/mingw64/share/qt6/qml"
          # Recursively find and copy DLL dependencies of astraplay.exe
          echo astraplay/astraplay.exe > tmp0.txt
          while [ -e tmp0.txt ]
          do
            cp tmp0.txt tmp.txt
            rm tmp0.txt
            sort -u tmp.txt -o tmp.txt
            ldd $(<tmp.txt) | awk '($2 == "=>") { print $3 }' | while read -r dep; do
              case "$dep" in
                ""|*"/Windows/"*|*"/WINDOWS/"*|*"/System32/"*|*"/SYSTEM32/"*|*"/SysWOW64/"*|*"/SYSWOW64/"*)
                  continue
                  ;;
              esac
              if [ -f "$dep" ] && [ ! -e "astraplay/${dep##*/}" ]; then
                echo "Copied $dep"
                cp "$dep" astraplay/
                echo "$dep" >> tmp0.txt
              fi
            done
          done
          # Copy Qt plugins and QML modules
          windeployqt6.exe --no-translations --qmldir=gui/src/qml astraplay/astraplay.exe
          # Copy dependencies of Qt plugins (windeployqt6 doesn't copy plugin dependencies like libjpeg-8.dll)
          echo "Finding Qt plugin DLLs..."
          find astraplay -type d \( -name plugins -o -name imageformats -o -name platforms -o -name sqldrivers \) -exec find {} -name "*.dll" \; | while read plugin; do
            echo "Found plugin: $plugin"
            echo "$plugin" >> tmp0.txt
          done
          echo "Copying plugin dependencies..."
          while [ -e tmp0.txt ] && [ -s tmp0.txt ]
          do
            cp tmp0.txt tmp.txt
            rm tmp0.txt
            sort -u tmp.txt -o tmp.txt
            ldd $(<tmp.txt) 2>/dev/null | awk '($2 == "=>") { print $3 }' | while read -r dep; do
              case "$dep" in
                ""|*"/Windows/"*|*"/WINDOWS/"*|*"/System32/"*|*"/SYSTEM32/"*|*"/SysWOW64/"*|*"/SYSWOW64/"*)
                  continue
                  ;;
              esac
              if [ -f "$dep" ] && [ ! -e "astraplay/${dep##*/}" ]; then
                echo "  Copying plugin dependency: ${dep##*/}"
                cp "$dep" astraplay/
                echo "$dep" >> tmp0.txt
              fi
            done
          done
          rm -f tmp0.txt tmp.txt

      - name: Create zip archive
        run: |
          zip -r astraplay.zip astraplay
          echo "RELEASE_PACKAGE_PATH=astraplay.zip" >> $GITHUB_ENV

      - name: Extract version
        id: extract_version
        uses: ./.github/actions/extract-version

      - name: Compile .ISS to .EXE Installer
        uses: Minionguyjpro/Inno-Setup-Action@v1.2.9
        with:
          path: "scripts/astraplay.iss"
          options: /O+

      - name: Rename installer with version
        run: |
          INSTALLER_NAME="astraplay-windows-installer-${{ env.CHIAKI_VERSION }}.exe"
          cp astraplay-windows-installer.exe "${INSTALLER_NAME}"
          echo "INSTALLER_NAME=${INSTALLER_NAME}" >> $GITHUB_ENV
          echo "Renamed installer to: ${INSTALLER_NAME}"

      - name: Build summary
        if: always()
        run: |
          ZIP_SIZE=$(ls -lh "${{ env.RELEASE_PACKAGE_PATH }}" 2>/dev/null | awk '{print $5}')
          INST_SIZE=$(ls -lh "${{ env.INSTALLER_NAME }}" 2>/dev/null | awk '{print $5}')
          {
            echo "## AstraPlay Windows — v${CHIAKI_VERSION}"
            echo ""
            echo "| Artifact | Size |"
            echo "| --- | --- |"
            echo "| Portable zip     | ${ZIP_SIZE:-?}  |"
            echo "| Installer (.exe) | ${INST_SIZE:-?} |"
            echo ""
            echo "Binaries are published to the [GitHub release](https://github.com/nileshchakraborty/AstraPlay/releases/latest)."
            echo ""
            echo "### How to use"
            echo "- **Portable zip** — unzip anywhere and run \`astraplay.exe\`. No install required."
            echo "- **Installer (.exe)** — run and follow the prompts; adds Start Menu shortcuts."
          } >> "$GITHUB_STEP_SUMMARY"

