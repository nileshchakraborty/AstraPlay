# Build macOS artifact — on-demand, build-only.

name: Build macOS (artifact)

on:
  workflow_dispatch:

concurrency:
  group: build-artifact-macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build macOS (artifact)
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set short commit hash
        run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Extract version
        id: extract_version
        uses: ./.github/actions/extract-version

      # Ad-hoc, no credentials file, no notarization, no notary keychain.
      # build-macos.sh installs its own Homebrew deps and creates both Pylux.app and Pylux.dmg.
      - name: Build ad-hoc .app and .dmg
        run: bash scripts/build-macos.sh arm64 --ad-hoc --no-credentials-file --no-notarize --skip-notary-keychain

      - name: Ensure DMG and Zip bundles exist
        working-directory: build-output
        run: |
          if [ ! -f "Pylux.dmg" ] && [ -d "Pylux.app" ]; then
            hdiutil create -srcfolder "Pylux.app" -volname "Pylux" "Pylux.dmg"
          fi
          zip -ry Pylux-macos.zip Pylux.app

      - name: Upload macOS DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: Pylux-macOS-${{ steps.extract_version.outputs.version }}-${{ env.SHORT_SHA }}.dmg
          path: build-output/Pylux.dmg
          retention-days: 14
          if-no-files-found: error

      - name: Upload macOS Zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: Pylux-macOS-${{ steps.extract_version.outputs.version }}-${{ env.SHORT_SHA }}.zip
          path: build-output/Pylux-macos.zip
          retention-days: 14
          if-no-files-found: error
