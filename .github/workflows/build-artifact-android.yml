# Build Android artifact — on-demand, build-only.

name: Build Android (artifact)

on:
  workflow_dispatch:

concurrency:
  group: build-artifact-android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build Android (artifact)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set short commit hash
        run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Extract version
        id: extract_version
        uses: ./.github/actions/extract-version

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Pre-fetch Gradle 8.7 Wrapper Distribution
        run: |
          DIST_DIR="$HOME/.gradle/wrapper/dists/gradle-8.7-bin/bhs2wmbdwecv87pi65oeuq5iu"
          mkdir -p "$DIST_DIR"
          if [ ! -d "$DIST_DIR/gradle-8.7" ] || [ ! -f "$DIST_DIR/gradle-8.7-bin.zip.ok" ]; then
            echo "Pre-fetching Gradle 8.7 distribution..."
            DOWNLOAD_OK=false
            for attempt in 1 2 3 4 5; do
              rm -rf "$DIST_DIR"/*
              if curl -fSL --retry 5 --retry-delay 5 --connect-timeout 20 --max-time 300 \
                "https://services.gradle.org/distributions/gradle-8.7-bin.zip" \
                -o "$DIST_DIR/gradle-8.7-bin.zip" && \
                [ $(wc -c < "$DIST_DIR/gradle-8.7-bin.zip") -gt 50000000 ] && \
                unzip -q "$DIST_DIR/gradle-8.7-bin.zip" -d "$DIST_DIR"; then
                touch "$DIST_DIR/gradle-8.7-bin.zip.ok"
                echo "Gradle 8.7 wrapper distribution cached and unpacked successfully."
                DOWNLOAD_OK=true
                break
              fi
              echo "Attempt $attempt to download/unpack Gradle 8.7 failed. Retrying in $((attempt * 5))s..."
              rm -rf "$DIST_DIR"/*
              sleep $((attempt * 5))
            done
            if [ "$DOWNLOAD_OK" != true ]; then
              echo "WARNING: Pre-fetch of Gradle 8.7 failed, ./gradlew will attempt direct download." >&2
            fi
          fi

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install NDK and CMake
        run: |
          sdkmanager --install \
            "ndk;28.2.13676358" \
            "cmake;3.30.4" \
            "build-tools;35.0.0" \
            "platforms;android-36" \
            "platforms;android-35"

      - name: Install protobuf tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq protobuf-compiler
          pip3 install 'protobuf>=5,<6' 'grpcio-tools>=1.60'

      # No keystore/signing: assembleDebug uses the auto-generated debug key.
      # We only need sdk.dir; the astraplayKeystore block in app/build.gradle stays
      # disabled, so the build is debug-signed (no release keystore secret needed).
      - name: Write local.properties
        working-directory: android
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      - name: Build debug APK
        working-directory: android
        env:
          ASTRAPLAY_RELAY_URL: ${{ secrets.ASTRAPLAY_RELAY_URL }}
        run: |
          SUCCESS=false
          for attempt in 1 2 3; do
            echo "Gradle build attempt $attempt..."
            if ./gradlew assembleDebug --parallel --build-cache -Dorg.gradle.java.home="$JAVA_HOME"; then
              SUCCESS=true
              break
            fi
            echo "Attempt $attempt failed (likely network timeout). Retrying in 10s..."
            sleep 10
          done
          if [ "$SUCCESS" != true ]; then
            echo "ERROR: Gradle build failed after 3 attempts." >&2
            exit 1
          fi

      - name: Upload Android artifact
        uses: actions/upload-artifact@v7
        with:
          name: AstraPlay-Android-${{ steps.extract_version.outputs.version }}-${{ env.SHORT_SHA }}.apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 14
          if-no-files-found: error
