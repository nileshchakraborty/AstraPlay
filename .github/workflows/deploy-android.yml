# Deploy Android + Android TV (Google Play Store & Sideload APK)
#
# Architectures: arm64-v8a, armeabi-v7a, x86, x86_64 (all ABIs in one AAB/APK)
# Output:
#   - Signed APK & AAB published to Google Play via Google Play Developer API (Fastlane)
#   - Sideloadable signed APK attached to GitHub Actions Artifacts
# Tracks:
#   release/beta → beta track
#   master       → production track
#   manual       → selectable track (production, beta, alpha, internal)
#
# Required secrets:
#   ANDROID_KEYSTORE_BASE64                  - base64 of upload keystore (.jks)
#   ANDROID_KEYSTORE_PASSWORD                - keystore password
#   ANDROID_KEY_ALIAS                        - signing key alias
#   ANDROID_KEY_PASSWORD                     - signing key password
#   GOOGLE_PLAY_SERVICE_ACCOUNT_JSON_BASE64  - base64 (or raw JSON) of service account JSON key

name: Deploy Android + Android TV (Google Play)

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Package format to build and deploy"
        type: choice
        options:
          - "both (AAB + APK)"
          - "aab (Store Track)"
          - "apk (Testing / Direct)"
        default: "both (AAB + APK)"
      track:
        description: "Google Play track (auto / production / beta / alpha / internal)"
        type: choice
        options:
          - "auto"
          - "production"
          - "beta"
          - "alpha"
          - "internal"
        default: "auto"
      publish_to_play:
        description: "Upload to Google Play Console via Developer API"
        type: boolean
        default: true
      build_apk:
        description: "Legacy compatibility flag: ensure APK is built"
        type: boolean
        default: false
  workflow_call:
    inputs:
      target:
        description: "Package format to build and deploy"
        type: string
        default: "both (AAB + APK)"
      track:
        description: "Google Play track"
        type: string
        default: "auto"
      publish_to_play:
        description: "Upload to Google Play Console via Developer API"
        type: boolean
        default: true
    outputs:
      chiaki_version:
        description: AstraPlay version from CMakeLists.txt
        value: ${{ jobs.build-android.outputs.chiaki_version }}
      play_testing_url:
        description: Google Play open testing opt-in URL
        value: ${{ jobs.build-android.outputs.play_testing_url }}
      play_store_url:
        description: Google Play store listing URL
        value: ${{ jobs.build-android.outputs.play_store_url }}
      android_upload_succeeded:
        description: Whether the Google Play upload step succeeded
        value: ${{ jobs.build-android.outputs.android_upload_succeeded }}

concurrency:
  group: build-android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-android:
    name: Build and deploy to Google Play
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      chiaki_version: ${{ steps.extract_version.outputs.version }}
      play_testing_url: ${{ steps.play_links.outputs.play_testing_url }}
      play_store_url: ${{ steps.play_links.outputs.play_store_url }}
      android_upload_succeeded: ${{ steps.upload_play.outcome == 'success' }}

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Extract version
        id: extract_version
        uses: ./.github/actions/extract-version

      - name: Play store links (workflow outputs)
        id: play_links
        if: always()
        run: |
          echo "play_testing_url=https://play.google.com/apps/testing/io.github.nileshchakraborty.astraplay" >> "$GITHUB_OUTPUT"
          echo "play_store_url=https://play.google.com/store/apps/details?id=io.github.nileshchakraborty.astraplay" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install NDK and CMake
        run: |
          sdkmanager --install \
            "ndk;28.2.13676358" \
            "cmake;3.30.4" \
            "build-tools;35.0.0" \
            "platforms;android-36" \
            "platforms;android-35"

      - name: Install protobuf tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq protobuf-compiler
          pip3 install 'protobuf>=5,<6' 'grpcio-tools>=1.60'

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::ANDROID_KEYSTORE_BASE64 not set — building unsigned"
            echo "SIGNING_CONFIGURED=false" >> "$GITHUB_ENV"
          else
            KEYSTORE_PATH="$RUNNER_TEMP/release.jks"
            echo "$KEYSTORE_BASE64" > "$RUNNER_TEMP/keystore.b64"
            base64 -d -i "$RUNNER_TEMP/keystore.b64" > "$KEYSTORE_PATH"
            rm -f "$RUNNER_TEMP/keystore.b64"
            echo "KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"
            echo "SIGNING_CONFIGURED=true" >> "$GITHUB_ENV"
          fi

      - name: Write local.properties
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          if [ "$SIGNING_CONFIGURED" = "true" ]; then
            echo "astraplayKeystore=${{ env.KEYSTORE_PATH }}" >> local.properties
            echo "astraplayKeystorePW=$KEYSTORE_PASSWORD" >> local.properties
            echo "astraplayKeyAlias=$KEY_ALIAS" >> local.properties
            echo "astraplayKeyPW=$KEY_PASSWORD" >> local.properties
            echo "Signing configured in local.properties"
          else
            echo "No signing — unsigned build only"
          fi

      - name: Build Android Packages (APK and AAB)
        id: build_packages
        working-directory: android
        run: |
          TARGET="${{ inputs.target || 'both (AAB + APK)' }}"
          if [ "${{ inputs.build_apk }}" = "true" ]; then
            TARGET="both (AAB + APK)"
          fi

          GRADLE_TASKS=""
          case "$TARGET" in
            *"aab"*)
              GRADLE_TASKS="bundleRelease"
              ;;
            *"apk"*)
              if [ "$SIGNING_CONFIGURED" = "true" ]; then
                GRADLE_TASKS="assembleRelease"
              else
                GRADLE_TASKS="assembleDebug"
              fi
              ;;
            *)
              if [ "$SIGNING_CONFIGURED" = "true" ]; then
                GRADLE_TASKS="assembleRelease bundleRelease"
              else
                GRADLE_TASKS="assembleDebug bundleRelease"
              fi
              ;;
          esac

          echo "Running Gradle tasks: $GRADLE_TASKS"
          ./gradlew $GRADLE_TASKS \
            --parallel \
            --build-cache \
            -Dorg.gradle.java.home="$JAVA_HOME"

          # Discover produced APK
          APK="$(find app/build/outputs/apk -name '*.apk' -print0 2>/dev/null | xargs -0 -r ls -t 2>/dev/null | head -1 || true)"
          if [ -n "$APK" ] && [ -f "$APK" ]; then
            SHORT_SHA="$(git rev-parse --short HEAD)"
            APK_NAME="astraplay-${{ steps.extract_version.outputs.version }}-${SHORT_SHA}.apk"
            cp "$APK" "$GITHUB_WORKSPACE/$APK_NAME"
            echo "apk_path=$PWD/$APK" >> "$GITHUB_OUTPUT"
            echo "apk_name=$APK_NAME" >> "$GITHUB_OUTPUT"
            echo "Found APK: $APK -> $APK_NAME"
          fi

          # Discover produced AAB
          AAB="$(find app/build/outputs/bundle -name '*.aab' -print0 2>/dev/null | xargs -0 -r ls -t 2>/dev/null | head -1 || true)"
          if [ -n "$AAB" ] && [ -f "$AAB" ]; then
            AAB_NAME="AstraPlay-${{ steps.extract_version.outputs.version }}.aab"
            cp "$AAB" "$GITHUB_WORKSPACE/$AAB_NAME"
            echo "aab_path=$PWD/$AAB" >> "$GITHUB_OUTPUT"
            echo "aab_name=$AAB_NAME" >> "$GITHUB_OUTPUT"
            echo "Found AAB: $AAB -> $AAB_NAME"
          fi

      - name: Upload APK artifact
        if: steps.build_packages.outputs.apk_name != ''
        uses: actions/upload-artifact@v7
        with:
          name: astraplay-android-apk
          path: ${{ steps.build_packages.outputs.apk_name }}
          if-no-files-found: warn

      - name: Upload AAB artifact
        if: steps.build_packages.outputs.aab_name != ''
        uses: actions/upload-artifact@v7
        with:
          name: astraplay-android-aab
          path: ${{ steps.build_packages.outputs.aab_name }}
          if-no-files-found: warn

      - name: Decode Google Play service account key
        id: play_credentials
        if: inputs.publish_to_play != false
        env:
          RAW_KEY: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON_BASE64 || secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON || secrets.GOOGLE_PLAY_JSON_KEY || secrets.PLAY_STORE_JSON_KEY }}
        run: |
          if [ -z "$RAW_KEY" ]; then
            echo "::warning::Google Play service account secret (GOOGLE_PLAY_SERVICE_ACCOUNT_JSON_BASE64) not found — skipping Play Store upload"
            echo "UPLOAD_ENABLED=false" >> "$GITHUB_ENV"
          else
            KEY_PATH="$RUNNER_TEMP/play-credentials.json"
            echo "$RAW_KEY" > "$RUNNER_TEMP/play-raw.key"

            # Check if input is base64 or plaintext JSON
            if base64 -d -i "$RUNNER_TEMP/play-raw.key" > "$KEY_PATH" 2>/dev/null && grep -q "private_key" "$KEY_PATH"; then
              echo "Successfully decoded base64 Google Play service account JSON key."
            elif grep -q "private_key" "$RUNNER_TEMP/play-raw.key"; then
              cp "$RUNNER_TEMP/play-raw.key" "$KEY_PATH"
              echo "Loaded plaintext Google Play service account JSON key."
            else
              echo "::error::Provided Google Play key does not appear to be a valid service account JSON key."
              rm -f "$RUNNER_TEMP/play-raw.key" "$KEY_PATH"
              echo "UPLOAD_ENABLED=false" >> "$GITHUB_ENV"
              exit 0
            fi

            rm -f "$RUNNER_TEMP/play-raw.key"
            echo "GOOGLE_PLAY_JSON_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"
            echo "UPLOAD_ENABLED=true" >> "$GITHUB_ENV"
          fi

      - name: Determine Google Play track
        if: env.UPLOAD_ENABLED == 'true'
        run: |
          CUSTOM_TRACK="${{ inputs.track || 'auto' }}"
          if [ "$CUSTOM_TRACK" != "auto" ] && [ -n "$CUSTOM_TRACK" ]; then
            TRACK="$CUSTOM_TRACK"
          elif [ "${{ github.ref_name }}" = "master" ]; then
            TRACK="production"
          else
            TRACK="beta"
          fi
          echo "ASTRAPLAY_PLAY_TRACK=$TRACK" >> "$GITHUB_ENV"
          echo "Deploying to Google Play track: $TRACK"

      - name: Deploy to Google Play Console (Fastlane API)
        id: upload_play
        if: env.UPLOAD_ENABLED == 'true'
        working-directory: android
        env:
          ANDROID_VERSION_CODE: ${{ steps.extract_version.outputs.semver_build_id }}
          ASTRAPLAY_AAB_PATH: ${{ steps.build_packages.outputs.aab_path }}
          ASTRAPLAY_APK_PATH: ${{ steps.build_packages.outputs.apk_path }}
          UPLOAD_APK_TO_PLAY: "true"
        run: |
          sudo gem install fastlane -N
          fastlane upload_to_play

      - name: Deployment summary
        if: always()
        run: |
          {
            echo "## AstraPlay Android — v${{ steps.extract_version.outputs.version }}"
            echo ""
            echo "| Item | Status |"
            echo "| --- | --- |"
            if [ -n "${{ steps.build_packages.outputs.apk_name }}" ]; then
              echo "| **Signed APK** | \`${{ steps.build_packages.outputs.apk_name }}\` (Artifact: \`astraplay-android-apk\`) |"
            fi
            if [ -n "${{ steps.build_packages.outputs.aab_name }}" ]; then
              echo "| **Signed AAB** | \`${{ steps.build_packages.outputs.aab_name }}\` (Artifact: \`astraplay-android-aab\`) |"
            fi
            echo "| **Signing Keystore** | ${{ env.SIGNING_CONFIGURED == 'true' && 'Configured (Release)' || 'Debug / Self-signed' }} |"

            case "${UPLOAD_ENABLED:-false}" in
              true)
                if [ "${{ steps.upload_play.outcome }}" = "success" ]; then
                  echo "| **Google Play Upload** | **Success** (Track: \`${ASTRAPLAY_PLAY_TRACK}\`) |"
                  echo ""
                  echo "### Google Play Links"
                  echo "- **Production Store**: [https://play.google.com/store/apps/details?id=io.github.nileshchakraborty.astraplay](https://play.google.com/store/apps/details?id=io.github.nileshchakraborty.astraplay)"
                  echo "- **Testing Program**: [https://play.google.com/apps/testing/io.github.nileshchakraborty.astraplay](https://play.google.com/apps/testing/io.github.nileshchakraborty.astraplay)"
                else
                  echo "| **Google Play Upload** | **Failed** (outcome: \`${{ steps.upload_play.outcome }}\`) |"
                fi
                ;;
              *)
                echo "| **Google Play Upload** | Skipped (API credentials not set or publish disabled) |"
                echo ""
                echo "> [!TIP]"
                echo "> Keystore signing succeeded! Both the signed **APK** and **AAB** are attached to the **Artifacts** section above."
                echo "> To enable direct automated Google Play Store deployment, add your Google Cloud service account JSON key to GitHub Secrets as \`GOOGLE_PLAY_SERVICE_ACCOUNT_JSON_BASE64\`."
                ;;
            esac
          } >> "$GITHUB_STEP_SUMMARY"
