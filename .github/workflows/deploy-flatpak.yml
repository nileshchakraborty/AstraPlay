# Deploy Flatpak (Flathub)
#
# AppStream release history (gui/*.metainfo.xml) is maintained manually for Flathub — not overwritten from CMake.
#
# Architecture: x86_64 (build verification) — Flathub itself builds both x86_64 + aarch64
# Output: CI build verification only. The bundle is not uploaded or attached to releases.
# Flathub publication requires a separate, human-reviewed submission.
#
# Manifest is kept in sync with:
#   https://github.com/flathub/io.github.nileshchakraborty.AstraPlay

name: Deploy Flatpak (Flathub)

on:
  workflow_dispatch:
  workflow_call:
    outputs:
      chiaki_version:
        description: AstraPlay version from CMakeLists.txt
        value: ${{ jobs.build-and-verify.outputs.chiaki_version }}
      flatpak_build_succeeded:
        description: Whether the Flatpak CI verify build succeeded
        value: ${{ jobs.build-and-verify.outputs.flatpak_build_succeeded }}
concurrency:
  group: deploy-flatpak-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-verify:
    name: Build and verify Flatpak (x86_64)
    runs-on: ubuntu-latest
    outputs:
      chiaki_version: ${{ steps.extract_version.outputs.version }}
      flatpak_build_succeeded: ${{ steps.flatpak_build.outcome == 'success' }}
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:kde-6.10
      options: --privileged

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Extract version
        id: extract_version
        uses: ./.github/actions/extract-version

      - name: Patch manifest to build from local checkout
        run: |
          sed -i '/^  - name: astraplay/,/^  - name:\|^$/{
            s|      - type: git|      - type: dir|
            s|        url:.*|        path: ../../|
            /commit:/d
          }' scripts/flatpak/io.github.nileshchakraborty.AstraPlay.yml

      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        id: flatpak_build
        with:
          bundle: astraplay-x64.flatpak
          manifest-path: scripts/flatpak/io.github.nileshchakraborty.AstraPlay.yml
          branch: stable
          cache-key: flatpak-builder-${{ github.sha }}
          arch: x86_64
          upload-artifact: "false"

      - name: Build summary
        if: always()
        run: |
          {
            echo "## AstraPlay Flatpak — v${CHIAKI_VERSION:-?} (x86_64)"
            echo ""
            if [ "${{ steps.flatpak_build.outcome }}" = "success" ]; then
              FP_SIZE=$(ls -lh astraplay-x64.flatpak 2>/dev/null | awk '{print $5}')
              echo "| Artifact | Size |"
              echo "| --- | --- |"
              echo "| Flatpak bundle | ${FP_SIZE:-?} |"
              echo ""
              echo "This CI job verifies the Flatpak build; it does not publish or upload the bundle."
              echo ""
              echo "### Run"
              echo ""
              echo '```bash'
              echo 'flatpak run io.github.nileshchakraborty.AstraPlay'
              echo '```'
              echo ""
              echo "### Flathub publication"
              echo "AstraPlay is not available on Flathub yet. A human-reviewed submission is required before users can install it from Discover."
            else
              echo "Flatpak build step outcome: **${{ steps.flatpak_build.outcome }}**. Fix manifest or build errors above."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

