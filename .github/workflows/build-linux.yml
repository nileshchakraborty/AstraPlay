# Build Linux (x86_64)
# Output: AppImage + portable zip as run artifacts (published to the GitHub release).

name: Build Linux

on:
  workflow_dispatch:
  workflow_call:
    outputs:
      chiaki_version:
        description: AstraPlay version from CMakeLists.txt
        value: ${{ jobs.build.outputs.chiaki_version }}

concurrency:
  group: build-linux-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build AstraPlay Linux x86_64
    runs-on: ubuntu-latest
    outputs:
      chiaki_version: ${{ steps.extract_version.outputs.version }}
    steps:
      - name: Install tools
        run: sudo apt-get update && sudo apt-get -y install podman zip jq

      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
          path: astraplay

      - name: Add QmlWebEngine import
        working-directory: astraplay
        run: cp scripts/qtwebengine_import.qml gui/src/qml/

      - name: Build in container
        working-directory: astraplay
        run: |
          podman run --rm \
            -v "$PWD:/build/chiaki" \
            -w "/build/chiaki" \
            --device /dev/fuse \
            --cap-add SYS_ADMIN \
            -t docker.io/streetpea/chiaki-ng-builder:qt6.9 \
            /bin/bash -c "sudo -E scripts/build-appimage.sh /build/appdir"

      - name: Package portable zip
        working-directory: astraplay/appimage
        run: zip -r astraplay.zip astraplay

      - name: Extract version
        id: extract_version
        uses: ./astraplay/.github/actions/extract-version
        with:
          cmakelists: astraplay/CMakeLists.txt

      - name: Build summary
        if: always()
        working-directory: astraplay/appimage
        run: |
          ZIP_SIZE=$(ls -lh astraplay.zip 2>/dev/null | awk '{print $5}')
          AI_SIZE=$(ls -lh astraplay.AppImage 2>/dev/null | awk '{print $5}')
          {
            echo "## AstraPlay Linux — v${CHIAKI_VERSION}"
            echo ""
            echo "| Artifact | Size |"
            echo "| --- | --- |"
            echo "| Portable zip | ${ZIP_SIZE:-?} |"
            echo "| AppImage     | ${AI_SIZE:-?}  |"
            echo ""
            echo "Binaries are published to the [GitHub release](https://github.com/nileshchakraborty/AstraPlay/releases/latest)."
            echo ""
            echo "### How to use"
            echo "- **Portable zip** — unzip and run \`linux/launch.sh\` (recommended for Steam)."
            echo "- **AppImage** — make executable and run. Set \`APPIMAGE_EXTRACT_AND_RUN=1\` if Steam misbehaves."
          } >> "$GITHUB_STEP_SUMMARY"
