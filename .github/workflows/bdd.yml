name: BDD tests

on:
  push:
    paths:
      - 'psstream-server/**'
  pull_request:
    paths:
      - 'psstream-server/**'

permissions:
  contents: read

jobs:
  cucumber:
    name: PSStream relay BDD (Cucumber)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: psstream-server
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: psstream-server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Cucumber tests
        run: npm run test:bdd
